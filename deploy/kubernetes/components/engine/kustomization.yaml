# The container engine (docs/kubernetes/components.md, Container engine on Kubernetes): Sysbox's
# dockerd as a sidecar in the sandboxes' pods granted `docker`, under the RuntimeClass Sysbox's
# install makes, and the egress proxy's engines' port (3129), through which it goes out. In your
# overlay, `components: [<this folder>]`, once Sysbox runs on the nodes; ENGINE_IMAGE pinned to
# your version.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: deckhand-env
    namespace: deckhand
    behavior: merge
    literals:
      - SANDBOX_ENGINE=sysbox
      - KUBERNETES_ENGINE_RUNTIME_CLASS=sysbox-runc
      - ENGINE_IMAGE=ghcr.io/bryansmee/deckhand-engine:latest

patches:
  # The proxy listens on 3129 whatever the runner: its Service publishes it here.
  - target:
      kind: Deployment
      name: egress
      namespace: deckhand
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: engines
          containerPort: 3129
  - target:
      kind: Service
      name: egress
      namespace: deckhand
    patch: |
      - op: add
        path: /spec/ports/-
        value:
          name: engines
          port: 3129
          targetPort: engines
  # The sandboxes reach it, their engines sharing their address: the runner accepts 3129 in
  # their policy only with the settings above.
  - target:
      kind: NetworkPolicy
      name: deckhand-sandboxes
      namespace: deckhand-sandboxes
    patch: |
      - op: add
        path: /spec/egress/0/ports/-
        value:
          port: 3129
          protocol: TCP
  - target:
      kind: NetworkPolicy
      name: deckhand-egress
      namespace: deckhand
    patch: |
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: deckhand-sandboxes
              podSelector:
                matchLabels:
                  deckhand.role: sandbox
          ports:
            - port: 3129
              protocol: TCP
