# Blob storage (docs/kubernetes.md, Blob storage): BLOB_URL and its key pair for the runner and
# the broker alone, the services that keep blobs, and their way to it. In your overlay,
# `components: [<this folder>]`, with the deckhand-blobs Secret made beforehand (its keys
# access-key-id and secret-access-key), and patches of yours replacing BLOB_URL in the
# deckhand-blobs ConfigMap and blobs.yaml's address with your blob storage's. The placeholders
# reach nothing: neither service starts until they are set (fail closed).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The base's label, which its own `labels` don't put on a component's objects.
labels:
  - pairs:
      app.kubernetes.io/part-of: deckhand
    includeSelectors: false

resources:
  - blobs.yaml

# Not deckhand-env, which the orchestrator and the models service read too: the runner's and
# the broker's alone. blobs.invalid never resolves.
configMapGenerator:
  - name: deckhand-blobs
    namespace: deckhand
    literals:
      - BLOB_URL=s3://deckhand?endpoint=https://blobs.invalid

# The same on both: BLOB_URL, and the key pair as files of the Secret (BLOB_*_FILE), read only.
patches:
  - target:
      kind: Deployment
      name: runner|broker
      namespace: deckhand
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BLOB_URL
          valueFrom:
            configMapKeyRef:
              name: deckhand-blobs
              key: BLOB_URL
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BLOB_ACCESS_KEY_ID_FILE
          value: /var/run/secrets/deckhand-blobs/access-key-id
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BLOB_SECRET_ACCESS_KEY_FILE
          value: /var/run/secrets/deckhand-blobs/secret-access-key
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: blobs
          mountPath: /var/run/secrets/deckhand-blobs
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: blobs
          secret:
            secretName: deckhand-blobs
            defaultMode: 288 # 0440: its group, fsGroup, reads it
