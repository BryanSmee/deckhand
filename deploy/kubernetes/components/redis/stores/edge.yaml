apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: deckhand
spec:
  template:
    spec:
      containers:
        - name: edge
          env:
            - name: STORE_URL
              value: "redis://edge@redis:6379?prefix=deckhand:edge:"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deckhand-redis
                  key: edge
      # Its store is in Redis now: nothing of its own on disk, its copies on any node.
      affinity: null
      volumes:
        - name: data
          persistentVolumeClaim: null
          emptyDir: {}
