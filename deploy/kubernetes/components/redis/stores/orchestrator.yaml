apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: deckhand
spec:
  template:
    spec:
      containers:
        - name: orchestrator
          env:
            - name: STORE_URL
              value: "redis://orchestrator@redis:6379?prefix=deckhand:orchestrator:"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: deckhand-redis
                  key: orchestrator
          # Its store is in Redis now: nothing of its own on disk, no volume at all (#619), its
          # root read-only. Its copies on any node.
          volumeMounts:
            - $patch: delete
              mountPath: /data
      affinity: null
      volumes:
        - $patch: delete
          name: data
