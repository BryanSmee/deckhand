# The broker (docs/guides/services.md#the-broker-service): the key that signs the runs' tokens and the
# services' own, the live runs and their files. Its key is a Secret you make once
# (deckhand-broker-key, docs/kubernetes/finish.md#the-secrets), which both copies mount: a copy with
# another key would sign tokens the other refuses. Its public key is the deckhand-service-keys
# ConfigMap, for the services that check tokens offline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: deckhand
  labels:
    app: deckhand-broker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: deckhand-broker
  template:
    metadata:
      # Its metrics, for the scrape jobs that read these (docs/kubernetes/metrics.md#metrics).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
      labels:
        app: deckhand-broker
    spec:
      serviceAccountName: deckhand-broker
      # Its own pods only: the API's token, to review its callers' (TokenReview).
      # No <SERVICE>_PORT variables: the policy Service's would read as POLICY_PORT, a setting.
      enableServiceLinks: false
      automountServiceAccountToken: true
      # The preStop pause (10 s), then its drain (30 s, over an inbox's long poll of 25 s).
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: deckhand-broker
      containers:
        - name: broker
          image: ghcr.io/bryansmee/deckhand-broker:latest
          ports:
            - name: http
              containerPort: 8081
            - name: metrics
              containerPort: 9464
          env:
            # GET /metrics alone, from the monitoring namespace alone (network-policies.yaml).
            - name: METRICS_PORT
              value: "9464"
            # Who calls, by its pod's service account (rbac.yaml): each service its own.
            - name: SERVICE_ACCOUNTS
              value: edge=deckhand:deckhand-edge,orchestrator=deckhand:deckhand-orchestrator,runner=deckhand:deckhand-runner,github=deckhand:deckhand-github,models=deckhand:deckhand-models,proxy=deckhand:deckhand-egress
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          # Its process answers: restarted after a minute without.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          # The old copy keeps taking connections until the Service no longer sends it any
          # (lifecycle.preStop: docs/contributing/upgrades.md, Draining).
          lifecycle:
            preStop:
              exec:
                command: [sleep, "10"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: key
              mountPath: /keys
              readOnly: true
            - name: store
              mountPath: /data
            # config.yaml, for metrics_port alone.
            - name: server
              mountPath: /etc/deckhand
              readOnly: true
      volumes:
        # run-token.key: read only, so never made again in its place.
        - name: key
          secret:
            secretName: deckhand-broker-key
            defaultMode: 288 # 0440: its group, fsGroup, reads it
        # The live runs, their files and events (STORE_URL's default, file:///data/store).
        - name: store
          persistentVolumeClaim:
            claimName: broker-store
        - name: server
          projected:
            sources:
              - configMap:
                  name: deckhand-server
                  items:
                    - key: config.yaml
                      path: config.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: broker-store
  namespace: deckhand
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: deckhand
spec:
  selector:
    app: deckhand-broker
  ports:
    - name: http
      port: 8081
      targetPort: http
    - name: metrics
      port: 9464
      targetPort: metrics
