# Deckhand's chart (docs/kubernetes/helm.md#install-with-helm). These defaults render the kustomize
# base, deploy/kubernetes: set what is yours in a values file of your own (`-f`), as an overlay
# would patch it. Secrets are never values: make them with kubectl and secrets.mjs, as with the
# base (docs/kubernetes/finish.md#the-secrets).

image:
  # Every service's image is <repository>-<service>:<tag> (deckhand-edge, deckhand-runner…).
  repository: ghcr.io/bryansmee/deckhand
  # A release (v1.2.3) or a digest's tag; empty: the chart's appVersion.
  tag: ""
  # SANDBOX_IMAGE, a reference the nodes can pull; empty: <repository>-sandbox:<tag>, which has
  # to match the services' release.
  sandbox: ""

# The services' namespace and the sandboxes' (docs/kubernetes/sandboxes.md#namespaces): two, never
# one. The chart makes both, with their Pod Security labels, so install its release in another
# namespace (your context's, `default`), not with `--namespace deckhand --create-namespace`.
# `create: false` if you make them yourself, labelled as namespaces.yaml labels them.
namespaces:
  create: true
  services: deckhand
  sandboxes: deckhand-sandboxes

# config.yaml and the grants folder, mounted at /etc/deckhand (docs/reference/settings.md,
# docs/security/policies.md#the-grants-folder). `--set-file server.config=config.yaml` reads yours.
# Read at start: the pods restart when they change, as the ConfigMap's name carries their hash.
server:
  config: |
    # Deckhand's settings, as server.example/config.yaml (every key: docs/reference/settings.md), under
    # the key config.yaml: your overlay or the chart's values replace them with yours
    # (docs/kubernetes/install.md#1-your-overlay). Read at start: the pods restart when it changes,
    # as the ConfigMap's name has a hash of it.

    # GitHub logins allowed to start runs and sign in: required, none starts otherwise.
    allowed_users: []
  # The grants folder's files, by their path in it: default.yaml, acme/api.yaml,
  # policy/grants.rego… The orchestrator, the runner, the github and policy services read them.
  grants:
    default.yaml: |
      # What every repository's sandboxes get, as server.example/grants/default.yaml
      # (docs/security/policies.md#the-grants-folder). Nothing set: nothing granted.

# Any other setting of the orchestrator, the runner and the models service, in deckhand-env
# (docs/reference/settings.md): MAX_PARALLEL, KUBERNETES_SESSION_SIZE, KUBERNETES_REGISTRY_HOSTS…
# One the values below set (KUBERNETES_NAMESPACE, SANDBOX_IMAGE…) is refused, naming the value.
env: {}

# The API server's addresses, the runner's and the broker's only way out
# (docs/kubernetes.md#the-api-servers-addresses). The placeholder reaches nothing: neither works
# until you set yours.
apiServer:
  cidrs: [192.0.2.1/32]

# Fixed at install, as the claims' storage classes below: a claim's access mode and class can't
# change (docs/kubernetes/helm.md#changing-the-storage says how to move). Where the services keep
# their stores: `file`, each on its own claim, its copies on one node; or `redis`, in Valkey
# (components/redis), for copies on several nodes, with the deckhand-redis Secret made beforehand
# (docs/kubernetes/components.md#several-nodes).
store: file

redis:
  image: valkey/valkey:8.1-alpine
  size: 5Gi
  # Empty: the cluster's default class.
  storageClass: ""

# The services' claims. Empty classes: the cluster's default. With `store: redis`, the
# runner's claim is ReadWriteMany (sharedStorageClass, else storageClass), and edge's, the
# orchestrator's, the broker's, the github and models services' go.
persistence:
  storageClass: ""
  sharedStorageClass: ""
  sizes:
    edge-data: 1Gi
    orchestrator-data: 5Gi
    runner-data: 5Gi
    broker-store: 2Gi
    github-data: 10Gi
    models-store: 1Gi
    egress-cache: 12Gi

# The sandboxes' claims, which the runner makes (docs/kubernetes/sandboxes.md): each issue's session
# (KUBERNETES_STORAGE_CLASS), the caches' and the agents' (ReadWriteMany:
# KUBERNETES_CACHE_STORAGE_CLASS, KUBERNETES_AGENT_STORAGE_CLASS). Empty: unset, so the sessions
# on the cluster's default class, no caches, and each sandbox installs its agent itself.
sandboxes:
  storageClass: ""
  cacheStorageClass: ""
  agentStorageClass: ""

# Repositories' own images (docs/kubernetes/components.md#repo-images): rootless BuildKit (the
# buildkit component), which lowers the services' namespace's Pod Security to `privileged`, and the
# registry the runner pushes to (`registry`, read with BuildKit alone), whose pull Secret you
# make beforehand.
buildkit:
  enabled: false
  image: moby/buildkit:v0.25.1-rootless
  # Your registry's host, when it runs in the cluster: its pulls skip the proxy.
  noProxy: ""

registry:
  # KUBERNETES_REGISTRY (registry.example.com/deckhand): required for repo images, and read with
  # buildkit.enabled alone (refused without it).
  url: ""
  # KUBERNETES_REGISTRY_SECRET, a kubernetes.io/dockerconfigjson Secret in the services'
  # namespace.
  secretName: deckhand-registry

# A container engine for the runs granted one
# (docs/kubernetes/components.md#container-engine-on-kubernetes): the engine component, Sysbox's
# dockerd as a sidecar under its RuntimeClass, and the egress proxy's engines' port (3129). Once
# Sysbox runs on the nodes.
engine:
  enabled: false
  # ENGINE_IMAGE; empty: <image.repository>-engine:<image.tag>, the services' release.
  image: ""
  # KUBERNETES_ENGINE_RUNTIME_CLASS: the RuntimeClass Sysbox's install makes.
  runtimeClass: sysbox-runc

# Blob storage (docs/kubernetes/components.md#blob-storage, docs/guides/blob-storage.md): the blobs
# component, BLOB_URL and its key pair for the runner and the broker alone, and their way to it. The
# Secret (keys access-key-id and secret-access-key) you make beforehand. The placeholders reach
# nothing: neither service starts until url, to and ports are yours.
blobs:
  enabled: false
  # BLOB_URL: s3://<bucket>[/<prefix>]?endpoint=https://…&region=…, or file:///<folder>.
  url: s3://deckhand?endpoint=https://blobs.invalid
  secretName: deckhand-blobs
  # Where it is, as a NetworkPolicy's peers: its addresses (ipBlock), or its pods when it runs
  # in the cluster (podSelector, with a namespaceSelector from another namespace).
  to:
    - ipBlock:
        cidr: 192.0.2.2/32
  # Its port: 443 for a hosted service over HTTPS, 3900 for Garage's.
  ports: [443]

# Every service's Prometheus metrics (docs/kubernetes/metrics.md#metrics): METRICS_PORT on each, its
# pods annotated for annotation-based scrape jobs (prometheus.io/scrape, port, path), and the port
# open to your monitoring namespace alone.
metrics:
  port: 9464
  # Your scraper's namespace (Prometheus', VictoriaMetrics'), by its kubernetes.io/metadata.name:
  # the only one reaching the port. Never the sandboxes' or the services' (refused).
  namespace: monitoring
  # A ServiceMonitor (the Prometheus Operator's) or a VMServiceScrape (VictoriaMetrics'
  # operator's) for the services, once its CRD is in the cluster.
  serviceMonitor:
    enabled: false
    # ServiceMonitor or VMServiceScrape.
    kind: ServiceMonitor
    # What your operator's selector picks (`release: kube-prometheus-stack`, say).
    labels: {}
    # 30s, say; empty: the scraper's own.
    interval: ""
  # The Grafana dashboard (deploy/grafana/deckhand.json) as a ConfigMap for Grafana's sidecar
  # (kube-prometheus-stack's, grafana's chart's), which loads the ConfigMaps carrying its label.
  # Its datasource is a variable of its own: any Prometheus or VictoriaMetrics one.
  dashboard:
    enabled: false
    # Its namespace: one the sidecar searches; empty: the services'.
    namespace: ""
    # The label the sidecar looks for (its `sidecar.dashboards.label` and `labelValue`).
    labels:
      grafana_dashboard: "1"
    # A folder, say, with the sidecar's `folderAnnotation` (grafana_folder: Deckhand).
    annotations: {}
  # The alert rules (deploy/alerts/deckhand.yaml, docs/guides/metrics.md#alerts) as a PrometheusRule (the
  # Prometheus Operator's) or a VMRule (VictoriaMetrics' operator's), once its CRD is in the
  # cluster.
  rules:
    enabled: false
    # PrometheusRule or VMRule.
    kind: PrometheusRule
    # What your operator's rule selector picks (`release: kube-prometheus-stack`, say).
    labels: {}
    # The job Deckhand's targets are scraped as, which DeckhandServiceDown selects: with
    # metrics.serviceMonitor, `deckhand` (its jobLabel), the default; without it, your scrape
    # job's (an annotation-based `kubernetes-pods`, say), required.
    job: ""

# Your ingress, to edge's port 8080 alone: GitHub's webhooks and the dashboard, over HTTPS.
ingress:
  enabled: false
  className: ""
  # Your Deckhand's host (deckhand.example.com): required with the ingress.
  host: ""
  annotations: {}
  # The certificate's Secret (or one your annotations have cert-manager make); empty: no TLS
  # here, as when your load balancer ends it.
  tlsSecretName: ""
