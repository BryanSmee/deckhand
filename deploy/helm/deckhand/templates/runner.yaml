# deploy/kubernetes/runner.yaml: the only pods with the Kubernetes API's credentials (rbac.yaml's
# Roles), which start, follow and remove the sandboxes' pods. Two copies, active/passive through
# its lease, as the orchestrator's.
{{- $redis := eq .Values.store "redis" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
  namespace: {{ include "deckhand.ns" . }}
  labels:
    {{- include "deckhand.labels" . | nindent 4 }}
    app: deckhand-runner
spec:
  replicas: 2
  {{- include "deckhand.strategy" . | nindent 2 }}
  selector:
    matchLabels:
      app: deckhand-runner
  template:
    metadata:
      {{- include "deckhand.metricsAnnotations" . | nindent 6 }}
      labels:
        app: deckhand-runner
    spec:
      serviceAccountName: deckhand-runner
      enableServiceLinks: false
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 300
      {{- include "deckhand.podSecurityContext" false | nindent 6 }}
      {{- if not $redis }}
      {{- include "deckhand.sameNode" "deckhand-runner" | nindent 6 }}
      {{- end }}
      containers:
        - name: runner
          image: {{ include "deckhand.image" (list . "runner") }}
          ports:
            - name: http
              containerPort: 8080
            {{- include "deckhand.metricsContainerPort" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "deckhand.envName" . }}
          env:
            {{- include "deckhand.metricsEnv" . | nindent 12 }}
            - name: SERVICE_NETWORKS
              value: none
            - name: SERVICE_ACCOUNT_TOKEN_FILE
              value: /var/run/secrets/deckhand/broker-token
            - name: SERVICE_KEYS_DIR
              value: /service-keys
            - name: HOME
              value: /tmp
            {{- if $redis }}
            {{- include "deckhand.redisStore" "runner" | nindent 12 }}
            {{- end }}
            {{- if .Values.blobs.enabled }}
            {{- include "deckhand.blobsEnv" . | nindent 12 }}
            {{- end }}
          {{- include "deckhand.probes" (list "http" "/health" "/health") | nindent 10 }}
          # Its /tmp is a tmpfs, charged to this pod (docs/kubernetes.md, Temporary files).
          resources:
            requests:
              memory: 3Gi
            limits:
              memory: 3Gi
          {{- include "deckhand.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: server
              mountPath: /etc/deckhand
              readOnly: true
            - name: service-keys
              mountPath: /service-keys
              readOnly: true
            - name: broker-token
              mountPath: /var/run/secrets/deckhand
              readOnly: true
            {{- if .Values.blobs.enabled }}
            {{- include "deckhand.blobsMount" . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: runner-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        {{- include "deckhand.serverVolume" (list . true) | nindent 8 }}
        - name: service-keys
          configMap:
            name: deckhand-service-keys
        {{- include "deckhand.brokerTokenVolume" . | nindent 8 }}
        {{- if .Values.blobs.enabled }}
        {{- include "deckhand.blobsVolume" . | nindent 8 }}
        {{- end }}
---
{{ include "deckhand.claim" (list . "runner-data" ($redis | ternary "ReadWriteMany" "ReadWriteOnce")) }}
---
apiVersion: v1
kind: Service
metadata:
  name: runner
  namespace: {{ include "deckhand.ns" . }}
  labels:
    {{- include "deckhand.labels" . | nindent 4 }}
spec:
  selector:
    app: deckhand-runner
  ports:
    - name: http
      port: 8080
      targetPort: http
    {{- include "deckhand.metricsServicePort" . | nindent 4 }}
