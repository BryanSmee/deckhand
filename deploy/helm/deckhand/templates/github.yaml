# deploy/kubernetes/github.yaml: the only pods with the GitHub App's key (the deckhand-github
# Secret); its way out is GitHub's. Two copies, both active on one store.
{{- $redis := eq .Values.store "redis" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github
  namespace: {{ include "deckhand.ns" . }}
  labels:
    {{- include "deckhand.labels" . | nindent 4 }}
    app: deckhand-github
spec:
  replicas: 2
  {{- include "deckhand.strategy" . | nindent 2 }}
  selector:
    matchLabels:
      app: deckhand-github
  template:
    metadata:
      {{- include "deckhand.metricsAnnotations" . | nindent 6 }}
      labels:
        app: deckhand-github
    spec:
      serviceAccountName: deckhand-github
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      {{- include "deckhand.podSecurityContext" false | nindent 6 }}
      {{- if not $redis }}
      {{- include "deckhand.sameNode" "deckhand-github" | nindent 6 }}
      {{- end }}
      containers:
        - name: github
          image: {{ include "deckhand.image" (list . "github") }}
          ports:
            - name: http
              containerPort: 8080
            {{- include "deckhand.metricsContainerPort" . | nindent 12 }}
          env:
            {{- include "deckhand.metricsEnv" . | nindent 12 }}
            - name: SERVICE_NETWORKS
              value: none
            - name: SERVICE_ACCOUNT_TOKEN_FILE
              value: /var/run/secrets/deckhand/broker-token
            - name: HOME
              value: /tmp
            {{- if $redis }}
            {{- include "deckhand.redisStore" "github" | nindent 12 }}
            {{- end }}
          {{- include "deckhand.probes" (list "http" "/ready" "/health") | nindent 10 }}
          lifecycle:
            preStop:
              exec:
                command: [sleep, "10"]
          # Its /tmp is a tmpfs, charged to this pod (docs/kubernetes.md, Temporary files).
          resources:
            requests:
              memory: 3Gi
            limits:
              memory: 3Gi
          {{- include "deckhand.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - name: app-key
              mountPath: /app-key
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: server
              mountPath: /etc/deckhand
              readOnly: true
            - name: broker-token
              mountPath: /var/run/secrets/deckhand
              readOnly: true
      volumes:
        - name: app-key
          secret:
            secretName: deckhand-github
            defaultMode: 288 # 0440: its group, fsGroup, reads it
        # Its store and the git mirrors; with Redis, the mirrors are a cache each copy keeps.
        - name: data
          {{- if $redis }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: github-data
          {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        {{- include "deckhand.serverVolume" (list . true) | nindent 8 }}
        {{- include "deckhand.brokerTokenVolume" . | nindent 8 }}
{{- if not $redis }}
---
{{ include "deckhand.claim" (list . "github-data" "ReadWriteOnce") }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: github
  namespace: {{ include "deckhand.ns" . }}
  labels:
    {{- include "deckhand.labels" . | nindent 4 }}
spec:
  selector:
    app: deckhand-github
  ports:
    - name: http
      port: 8080
      targetPort: http
    {{- include "deckhand.metricsServicePort" . | nindent 4 }}
