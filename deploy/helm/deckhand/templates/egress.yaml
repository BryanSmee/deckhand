# deploy/kubernetes/egress.yaml: the sandboxes' egress proxy, their only way out. One copy, and a
# second during an update (its CA in its volume: two at all times would make two).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress
  namespace: {{ include "deckhand.ns" . }}
  labels:
    {{- include "deckhand.labels" . | nindent 4 }}
    app: deckhand-egress
spec:
  replicas: 1
  {{- include "deckhand.strategy" . | nindent 2 }}
  selector:
    matchLabels:
      app: deckhand-egress
  template:
    metadata:
      labels:
        app: deckhand-egress
    spec:
      serviceAccountName: deckhand-egress
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 630
      {{- include "deckhand.podSecurityContext" false | nindent 6 }}
      {{- include "deckhand.sameNode" "deckhand-egress" | nindent 6 }}
      containers:
        - name: egress
          image: {{ include "deckhand.image" (list . "egress") }}
          ports:
            - name: proxy
              containerPort: 3128
          env:
            - name: DRAIN_SECONDS
              value: "600"
            - name: SERVICE_ACCOUNT_TOKEN_FILE
              value: /var/run/secrets/deckhand/broker-token
          {{- include "deckhand.probes" (list "proxy" "/ready" "/ready") | nindent 10 }}
          lifecycle:
            preStop:
              exec:
                command: [sleep, "10"]
          {{- include "deckhand.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: broker-token
              mountPath: /var/run/secrets/deckhand
              readOnly: true
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: egress-cache
        {{- include "deckhand.brokerTokenVolume" . | nindent 8 }}
---
{{ include "deckhand.claim" (list . "egress-cache" "ReadWriteOnce") }}
---
# Named after EGRESS_PROXY's host: sandboxes reach it by the hostAliases the runner gives them.
apiVersion: v1
kind: Service
metadata:
  name: egress
  namespace: {{ include "deckhand.ns" . }}
  labels:
    {{- include "deckhand.labels" . | nindent 4 }}
spec:
  selector:
    app: deckhand-egress
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
