# promtool's unit tests of deckhand.yaml: `promtool test rules deploy/alerts/deckhand.test.yaml`
# (CI's kubernetes job). Each alert fires on what it is about, and not on its neighbour case.
rule_files: [deckhand.yaml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: deckhand_network_isolated{instance="runner:9464"}
        values: 1 1 0 0
    alert_rule_test:
      - eval_time: 1m
        alertname: DeckhandNetworkNotIsolated
        exp_alerts: []
      - eval_time: 2m
        alertname: DeckhandNetworkNotIsolated
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "Sandboxes aren't network-isolated: every run is refused"
              description: "The network probe found a sandbox reaching something other than the egress proxy. Check the sandboxes' NetworkPolicies and that the cluster's network plugin enforces them (docs/kubernetes.md, The network probe; deploy/kubernetes/check-isolation.sh)."

  # edge:9464 stops answering, and stays down past the hour; orchestrator-a is replaced by
  # orchestrator-b (a rollout), which takes it out of the targets: no alert for it. Another
  # job's target down isn't Deckhand's.
  - interval: 1m
    input_series:
      - series: up{job="deckhand", instance="edge:9464"}
        values: 1 1 1 0x180
      - series: up{job="deckhand", instance="orchestrator-a:9464"}
        values: 1 1 1
      - series: up{job="deckhand", instance="orchestrator-b:9464"}
        values: _ _ 1x180
      - series: up{job="node", instance="node:9100"}
        values: 0x180
    alert_rule_test:
      - eval_time: 6m
        alertname: DeckhandServiceDown
        exp_alerts: []
      - eval_time: 9m
        alertname: DeckhandServiceDown
        exp_alerts:
          - exp_labels: { severity: critical, job: deckhand, instance: "edge:9464" }
            exp_annotations:
              summary: "Deckhand's edge:9464 doesn't answer"
              description: "edge:9464 hasn't answered its metrics port for 5 minutes. Its logs (docker compose logs, kubectl logs --previous) say why."
      - eval_time: 150m
        alertname: DeckhandServiceDown
        exp_alerts:
          - exp_labels: { severity: critical, job: deckhand, instance: "edge:9464" }
            exp_annotations:
              summary: "Deckhand's edge:9464 doesn't answer"
              description: "edge:9464 hasn't answered its metrics port for 5 minutes. Its logs (docker compose logs, kubectl logs --previous) say why."

  # The orchestrator's copies both wait; the runner's and edge's are held.
  - interval: 1m
    input_series:
      - series: deckhand_lease_held{instance="a", lease="orchestrator"}
        values: 1 1 0x5
      - series: deckhand_lease_held{instance="b", lease="orchestrator"}
        values: 0 0 0x5
      - series: deckhand_lease_held{instance="a", lease="runner"}
        values: 0x7
      - series: deckhand_lease_held{instance="b", lease="runner"}
        values: 1x7
      - series: deckhand_lease_held{instance="edge", lease="edge/redeliveries"}
        values: 1x7
    alert_rule_test:
      - eval_time: 3m
        alertname: DeckhandNoLeaseHolder
        exp_alerts: []
      - eval_time: 5m
        alertname: DeckhandNoLeaseHolder
        exp_alerts:
          - exp_labels: { severity: critical, lease: orchestrator }
            exp_annotations:
              summary: "No copy holds Deckhand's orchestrator lease"
              description: "No copy acts for the orchestrator lease: every copy answering waits for it, or none answers at all. The store holds the lease: check it is reachable (Redis, or the shared volume), that the copies run, and their logs."

  # Every copy of the runner gone (no series left), the others held.
  - interval: 1m
    input_series:
      - series: deckhand_lease_held{instance="o", lease="orchestrator"}
        values: 1x10
      - series: deckhand_lease_held{instance="r", lease="runner"}
        values: 1 1
      - series: deckhand_lease_held{instance="edge", lease="edge/redeliveries"}
        values: 1x10
    alert_rule_test:
      - eval_time: 2m
        alertname: DeckhandNoLeaseHolder
        exp_alerts: []
      - eval_time: 10m
        alertname: DeckhandNoLeaseHolder
        exp_alerts:
          - exp_labels: { severity: critical, lease: runner }
            exp_annotations:
              summary: "No copy holds Deckhand's runner lease"
              description: "No copy acts for the runner lease: every copy answering waits for it, or none answers at all. The store holds the lease: check it is reachable (Redis, or the shared volume), that the copies run, and their logs."

  # 4 errors of 10 runs an hour fires; 2 of 4 doesn't (too few).
  - interval: 1m
    input_series:
      - series: deckhand_runs_finished_total{mode="work", outcome="error"}
        values: 0+0.0667x90
      - series: deckhand_runs_finished_total{mode="work", outcome="ok"}
        values: 0+0.1x90
    alert_rule_test:
      - eval_time: 80m
        alertname: DeckhandRunsFailing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "40.01% of Deckhand's runs ended in an error in the last hour"
              description: "More than a quarter of the runs that ended in the last hour, at least 3, ended in an error. The orchestrator's `done (error …)` log lines and the runs' logs on the dashboard say why: an agent's credential, an image build, a sandbox start."
  - interval: 1m
    input_series:
      - series: deckhand_runs_finished_total{mode="work", outcome="error"}
        values: 0+0.0333x90
      - series: deckhand_runs_finished_total{mode="work", outcome="ok"}
        values: 0+0.0333x90
    alert_rule_test:
      - eval_time: 80m
        alertname: DeckhandRunsFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: deckhand_github_rate_limit_remaining{resource="core"}
        values: 900 400x10
      - series: deckhand_github_rate_limit_limit{resource="core"}
        values: 5000x10
      - series: deckhand_github_rate_limit_remaining{resource="graphql"}
        values: 4000x10
      - series: deckhand_github_rate_limit_limit{resource="graphql"}
        values: 5000x10
      # A minute's searches spent: not an alert.
      - series: deckhand_github_rate_limit_remaining{resource="search"}
        values: 1x10
      - series: deckhand_github_rate_limit_limit{resource="search"}
        values: 30x10
    alert_rule_test:
      - eval_time: 3m
        alertname: DeckhandGitHubRateLimitLow
        exp_alerts: []
      - eval_time: 7m
        alertname: DeckhandGitHubRateLimitLow
        exp_alerts:
          - exp_labels: { severity: warning, resource: core }
            exp_annotations:
              summary: "GitHub's core rate limit is 8% left"
              description: "Under 10 % of a GitHub rate limit has been left for 5 minutes: runs stall once it is spent, until it resets (deckhand_github_rate_limit_reset_seconds). deckhand_github_api_calls_total by caller says who spends it."

  # Anthropic answers 529 to a third of the calls; OpenAI's 429s stay under 10 %.
  - interval: 1m
    input_series:
      - series: deckhand_model_calls_total{provider="anthropic", agent="claude", status="2xx"}
        values: 0+20x40
      - series: deckhand_model_calls_total{provider="anthropic", agent="claude", status="529"}
        values: 0+10x40
      - series: deckhand_model_calls_total{provider="openai", agent="codex", status="2xx"}
        values: 0+20x40
      - series: deckhand_model_calls_total{provider="openai", agent="codex", status="429"}
        values: 0+1x40
    alert_rule_test:
      - eval_time: 30m
        alertname: DeckhandModelsLimited
        exp_alerts:
          - exp_labels: { severity: warning, provider: anthropic }
            exp_annotations:
              summary: "33.33% of the calls to anthropic answer 429 or 529"
              description: "For 15 minutes, over 10 % of the agents' calls to anthropic were refused for a limit (429) or overload (529). A plan used up shows on the dashboard's bars (deckhand_plan_usage_ratio); FALLBACKS moves runs to another provider."

  # Two tasks wait for a slot with 1 run of 3 going; then the slots fill up.
  - interval: 1m
    input_series:
      - series: deckhand_runs_queued{reason="slot"}
        values: 2x40
      - series: deckhand_runs_queued{reason="pause"}
        values: 1x40
      - series: deckhand_runs_running
        values: 1x20 3x20
      - series: deckhand_max_parallel
        values: 3x40
    alert_rule_test:
      - eval_time: 18m
        alertname: DeckhandQueueStuck
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "2 Deckhand task(s) wait for a slot while slots are free"
              description: "Tasks have waited for a free slot for 15 minutes with fewer runs going than MAX_PARALLEL. The orchestrator's log says why its runs don't start: the runner, the policy service or the broker away (deckhand_service_calls_total), or its store."
      - eval_time: 30m
        alertname: DeckhandQueueStuck
        exp_alerts: []

  # AUTO_PICKUP_SLOTS=1, used: an auto-picked task waits for it (`pickup`), the other slots
  # free and not its.
  - interval: 1m
    input_series:
      - series: deckhand_runs_queued{reason="slot"}
        values: 0x40
      - series: deckhand_runs_queued{reason="pickup"}
        values: 1x40
      - series: deckhand_runs_running
        values: 1x40
      - series: deckhand_max_parallel
        values: 3x40
    alert_rule_test:
      - eval_time: 30m
        alertname: DeckhandQueueStuck
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: deckhand_sandboxes_failed_to_start_total{reason="unschedulable"}
        values: 0 0 1 1
      - series: deckhand_sandboxes_failed_to_start_total{reason="refused"}
        values: 0 1 2 3
    alert_rule_test:
      - eval_time: 3m
        alertname: DeckhandSandboxesStuckStarting
        exp_alerts:
          - exp_labels: { severity: warning, reason: unschedulable }
            exp_annotations:
              summary: "Deckhand's sandboxes stay Pending (unschedulable)"
              description: "Sandboxes were given up on after staying Pending: `unschedulable` (no node with the room), `image_pull`, `agent_install` (its init container), `network_gate` (its NetworkPolicies never applied) or `pending`. kubectl describe pod in the sandboxes' namespace, and the runner's log, say more."

  # Every start in the 600 s bucket.
  - interval: 1m
    input_series:
      - series: deckhand_sandbox_start_seconds_bucket{le="300"}
        values: 0x90
      - series: deckhand_sandbox_start_seconds_bucket{le="600"}
        values: 0+1x90
      - series: deckhand_sandbox_start_seconds_bucket{le="+Inf"}
        values: 0+1x90
    alert_rule_test:
      - eval_time: 10m
        alertname: DeckhandSandboxStartsSlow
        exp_alerts: []
      - eval_time: 80m
        alertname: DeckhandSandboxStartsSlow
        exp_alerts:
          - exp_labels: { severity: info }
            exp_annotations:
              summary: "Deckhand's sandboxes take 9m 30s to start (p90)"
              description: "One sandbox start in ten took over 5 minutes in the last hour. A large image pulled on every node, a slow registry, or a cluster scaling up its nodes for each."

  # Full for over an hour; a cache turned off (its max 0) never is.
  - interval: 5m
    input_series:
      - series: deckhand_egress_cache_bytes
        values: 9.9e9x20
      - series: deckhand_egress_cache_max_bytes
        values: 1e10x20
    alert_rule_test:
      - eval_time: 30m
        alertname: DeckhandEgressCacheFull
        exp_alerts: []
      - eval_time: 70m
        alertname: DeckhandEgressCacheFull
        exp_alerts:
          - exp_labels: { severity: info }
            exp_annotations:
              summary: "The egress cache is full"
              description: "The egress cache has held 95 % of EGRESS_CACHE_MAX for an hour, evicting the least recently used answers. If its misses grow (deckhand_egress_cache_requests_total), raise EGRESS_CACHE_MAX and the volume under it."
  - interval: 5m
    input_series:
      - series: deckhand_egress_cache_bytes
        values: 0x20
      - series: deckhand_egress_cache_max_bytes
        values: 0x20
    alert_rule_test:
      - eval_time: 70m
        alertname: DeckhandEgressCacheFull
        exp_alerts: []
