<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deckhand</title>
    <style>
      :root {
        --bg: #fafaf9;
        --panel: #ffffff;
        --ink: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --code: #f5f5f4;
        --accent: #c2410c;
        --ok: #15803d;
        --err: #b91c1c;
        --run: #1d4ed8;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0a09;
          --panel: #1c1917;
          --ink: #f5f5f4;
          --muted: #a8a29e;
          --line: #292524;
          --code: #0c0a09;
          --accent: #fb923c;
          --ok: #4ade80;
          --err: #f87171;
          --run: #60a5fa;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 system-ui,
          sans-serif;
        height: 100vh;
        height: 100dvh;
        display: grid;
        grid-template-columns: minmax(17rem, 24rem) 1fr;
      }
      aside {
        border-right: 1px solid var(--line);
        overflow-y: auto;
        background: var(--panel);
      }
      header {
        padding: 1rem;
        border-bottom: 1px solid var(--line);
      }
      header .top {
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
        justify-content: space-between;
      }
      header h1 {
        margin: 0;
        font-size: 1rem;
      }
      header p {
        margin: 0.25rem 0 0;
        color: var(--muted);
        font-size: 0.8rem;
      }
      #who {
        color: var(--muted);
        font-size: 0.8rem;
        white-space: nowrap;
      }
      #who button {
        font: inherit;
        color: var(--accent);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
      }
      .filters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      select {
        font: inherit;
        font-size: 0.85rem;
        min-width: 0;
        padding: 0.35rem 0.4rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--ink);
      }
      h2,
      h3 {
        margin: 1rem 1rem 0.25rem;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      h3 {
        margin-top: 0.5rem;
        text-transform: none;
        letter-spacing: 0;
        font-size: 0.8rem;
        color: var(--ink);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li button {
        all: unset;
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem 1rem;
        cursor: pointer;
        display: grid;
        grid-template-columns: 1rem 1fr auto;
        gap: 0.5rem;
        align-items: baseline;
      }
      li button:hover,
      li button:focus-visible {
        background: var(--code);
      }
      li button[aria-current="true"] {
        background: var(--code);
        box-shadow: inset 3px 0 var(--accent);
      }
      .state-name {
        color: var(--muted);
        font-size: 0.8rem;
      }
      .dot {
        font-size: 0.7rem;
      }
      .working,
      .building-image,
      .stopping,
      .brainstorm,
      .running {
        color: var(--run);
      }
      .done,
      .ok {
        color: var(--ok);
      }
      .needs-input {
        color: var(--accent);
      }
      .error,
      .interrupted {
        color: var(--err);
      }
      .queued,
      .idle-brainstorm {
        color: var(--muted);
      }
      .when {
        color: var(--muted);
        font-size: 0.75rem;
        white-space: nowrap;
      }
      .empty {
        padding: 0.5rem 1rem;
        color: var(--muted);
      }
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      #title {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 0.5rem 1rem;
        align-items: baseline;
        flex-wrap: wrap;
      }
      #title strong {
        font-size: 1rem;
      }
      #title a {
        color: var(--accent);
      }
      #back {
        display: none;
        font: inherit;
        color: var(--accent);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      #history {
        display: flex;
        gap: 0.4rem;
        overflow-x: auto;
        padding: 0.5rem 1.25rem;
        border-bottom: 1px solid var(--line);
      }
      #history:empty {
        display: none;
      }
      #history button {
        font: inherit;
        font-size: 0.75rem;
        white-space: nowrap;
        padding: 0.2rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }
      #history button[aria-current="true"] {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 1.25rem 3rem;
      }
      .entry {
        margin: 0 0 0.75rem;
        max-width: 60rem;
        overflow-wrap: anywhere;
      }
      .text {
        white-space: pre-wrap;
      }
      .meta {
        color: var(--muted);
        font-style: italic;
        white-space: pre-wrap;
      }
      pre {
        margin: 0;
        padding: 0.5rem 0.75rem;
        background: var(--code);
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow-x: auto;
        font:
          12px/1.45 ui-monospace,
          monospace;
      }
      .tool summary {
        cursor: pointer;
        list-style: none;
      }
      .tool summary::-webkit-details-marker {
        display: none;
      }
      .tool .name {
        color: var(--accent);
        font-weight: 600;
        margin-right: 0.5rem;
      }
      .tool summary pre {
        display: inline-block;
        vertical-align: top;
        max-width: calc(100% - 6rem);
        white-space: pre-wrap;
      }
      .tool .out {
        margin: 0.25rem 0 0 1.5rem;
        color: var(--muted);
      }
      .tool .out.error {
        color: var(--err);
      }
      .raw pre {
        color: var(--muted);
      }
      .result {
        border-left: 3px solid var(--ok);
        padding: 0.5rem 0.75rem;
        background: var(--panel);
        white-space: pre-wrap;
      }
      .result.error {
        border-color: var(--err);
      }
      .result.needs-input {
        border-color: var(--accent);
        color: inherit;
      }
      #follow {
        position: fixed;
        right: 1.5rem;
        bottom: 1.5rem;
        font: inherit;
        padding: 0.4rem 0.8rem;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 999px;
        cursor: pointer;
      }
      /* A phone shows the list, or one entry's log with a way back. */
      @media (max-width: 760px) {
        body {
          grid-template-columns: 1fr;
        }
        aside {
          border-right: 0;
        }
        body.reading aside,
        body:not(.reading) main {
          display: none;
        }
        #back {
          display: inline;
        }
        #title {
          padding: 0.75rem 1rem;
        }
        #history {
          padding: 0.5rem 1rem;
        }
        #log {
          padding: 0.75rem 1rem 3rem;
        }
        .tool summary pre {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <header>
        <div class="top">
          <h1>Deckhand</h1>
          <form id="who" method="post" action="auth/logout" hidden>
            <span id="login"></span> · <button type="submit">Sign out</button>
          </form>
        </div>
        <p id="summary">Loading…</p>
        <div class="filters">
          <select id="repo" aria-label="Repository">
            <option value="">All repos</option>
          </select>
          <select id="state" aria-label="State">
            <option value="">All states</option>
          </select>
        </div>
      </header>
      <div id="tasks"></div>
    </aside>
    <main>
      <div id="title">
        <button id="back" type="button">← All</button>
        <strong>Pick an issue or pull request</strong>
      </div>
      <div id="history"></div>
      <div id="log"></div>
      <button id="follow" hidden>↓ Follow</button>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let tasks = [];
      let serverNow = Date.now();
      // The entry shown: its latest run, followed as new ones start, unless a run was picked.
      let selected = null; // { key, run: id | null }
      let shown = null; // the run whose log is on screen
      let source = null;

      const STATE_NAMES = {
        "building-image": "building image",
        working: "working",
        stopping: "stopping",
        queued: "queued",
        brainstorm: "brainstorm",
        "idle-brainstorm": "idle brainstorm",
        "needs-input": "needs input",
        done: "done",
        error: "error",
        interrupted: "interrupted",
      };
      const dot = {
        "building-image": "◐",
        working: "●",
        stopping: "◼",
        queued: "○",
        brainstorm: "◆",
        "idle-brainstorm": "◌",
        "needs-input": "?",
        done: "✓",
        error: "✕",
        interrupted: "✕",
        running: "●",
        ok: "✓",
      };
      const runStatus = { ok: "done", running: "running" };

      const ago = (ms) => {
        const s = Math.round((serverNow - ms) / 1000);
        if (s < 60) return `${Math.max(0, s)}s ago`;
        if (s < 3600) return `${Math.round(s / 60)} min ago`;
        if (s < 86400) return `${Math.round(s / 3600)} h ago`;
        return new Date(ms).toLocaleDateString();
      };
      const duration = (r) => {
        const ms = (r.finishedAt ?? serverNow) - r.startedAt;
        return `${Math.round(ms / 6000) / 10} min`;
      };
      const icons = { brainstorm: "💬 ", discussion: "🗨️ ", idea: "💡 ", bug: "🐞 " };
      const names = { pr: "PR", discussion: "Discussion" };
      const label = (t) => `${icons[t.kind] ?? ""}${names[t.kind] ?? "Issue"} #${t.number}`;
      const link = (t) =>
        t.repo && t.replyTo
          ? `https://github.com/${t.repo}/${t.kind === "discussion" ? "discussions" : "issues"}/${t.replyTo}`
          : null;
      const live = (t) => ["building-image", "working", "stopping"].includes(t.state);
      // What the row says besides the state: how long, until when, or how long ago.
      const when = (t) => {
        const last = t.runs[0];
        if (live(t) && last) return duration(last);
        if (t.state === "queued") return `reply on #${t.replyTo}`;
        if (t.state === "brainstorm")
          return `idle in ${Math.max(0, Math.ceil((t.deadline - serverNow) / 60000))} min`;
        if (t.state === "idle-brainstorm") return `since ${ago(t.deadline)}`;
        return last ? ago(last.startedAt) : "";
      };

      function el(tag, attrs = {}, ...children) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") node.className = v;
          else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
          else node.setAttribute(k, v);
        }
        node.append(...children.filter((c) => c !== null && c !== undefined));
        return node;
      }

      // Filters are kept on this device.
      const filters = {
        repo: localStorage.getItem("deckhand.repo") ?? "",
        state: localStorage.getItem("deckhand.state") ?? "",
      };
      for (const name of ["repo", "state"]) {
        $(name).addEventListener("change", () => {
          filters[name] = $(name).value;
          localStorage.setItem(`deckhand.${name}`, filters[name]);
          renderList();
        });
      }

      // A select's options with their counts, keeping the choice even when nothing matches.
      function options(select, all, values, names = {}) {
        const counts = new Map();
        for (const v of values) counts.set(v, (counts.get(v) ?? 0) + 1);
        const chosen = filters[select.id];
        const keys = [...new Set([...all, ...(chosen ? [chosen] : [])])];
        select.replaceChildren(
          select.options[0],
          ...keys
            .filter((k) => counts.has(k) || k === chosen)
            .map((k) => el("option", { value: k }, `${names[k] ?? k} (${counts.get(k) ?? 0})`)),
        );
        select.value = chosen;
      }

      async function refresh() {
        try {
          const res = await fetch("api/state", { cache: "no-store" });
          // Signed out (or removed from the allowed users): back to the sign-in page.
          if (res.status === 401) return location.reload();
          if (!res.ok) throw new Error(res.status);
          const state = await res.json();
          tasks = state.tasks;
          serverNow = state.now ?? Date.now();
          $("login").textContent = `@${state.user}`;
          $("who").hidden = false;
          const hooks = (state.previews ?? []).length;
          $("summary").textContent =
            `${state.running} running (max ${state.maxParallel}), ${state.queued} queued` +
            (hooks ? `, ${hooks} preview hook${hooks > 1 ? "s" : ""}` : "");
          const repos = [...new Set(tasks.map((t) => t.repo))].sort();
          options(
            $("repo"),
            repos,
            tasks.map((t) => t.repo),
          );
          options(
            $("state"),
            state.states,
            tasks.map((t) => t.state),
            STATE_NAMES,
          );
          renderList();
          if (!selected) restore();
          else showTask();
        } catch (error) {
          $("summary").textContent = `Can't reach the listener (${error.message})`;
        }
      }

      // Grouped by project (the repo's owner), then repo, in order of activity.
      function renderList() {
        const visible = tasks.filter(
          (t) =>
            (!filters.repo || t.repo === filters.repo) &&
            (!filters.state || t.state === filters.state),
        );
        const projects = new Map();
        for (const t of visible) {
          if (!projects.has(t.project)) projects.set(t.project, new Map());
          const repos = projects.get(t.project);
          if (!repos.has(t.repo)) repos.set(t.repo, []);
          repos.get(t.repo).push(t);
        }
        $("tasks").replaceChildren(
          ...(visible.length
            ? [...projects].flatMap(([project, repos]) => [
                el("h2", {}, project),
                ...[...repos].flatMap(([repo, list]) => [
                  el("h3", {}, repo.slice(project.length + 1)),
                  el("ul", {}, ...list.map(row)),
                ]),
              ])
            : [
                el(
                  "p",
                  { class: "empty" },
                  tasks.length ? "Nothing matches these filters" : "No runs yet",
                ),
              ]),
        );
      }

      function row(t) {
        return el(
          "li",
          {},
          el(
            "button",
            {
              "aria-current": String(t.key === selected?.key),
              title: STATE_NAMES[t.state],
              onclick: () => select(t.key),
            },
            el("span", { class: `dot ${t.state}` }, dot[t.state] ?? "?"),
            el(
              "span",
              {},
              label(t) + " ",
              el("span", { class: `state-name ${t.state}` }, STATE_NAMES[t.state] ?? t.state),
            ),
            el("span", { class: "when" }, when(t)),
          ),
        );
      }

      // From the address: "#task=<key>&run=<id>", so a link opens the same log.
      function restore() {
        const wanted = new URLSearchParams(location.hash.slice(1));
        const key = wanted.get("task");
        if (key && tasks.some((t) => t.key === key)) select(key, wanted.get("run"));
        else if (matchMedia("(min-width: 761px)").matches) {
          const first = tasks.find(live) ?? tasks[0];
          if (first) select(first.key, null, false);
        }
      }

      function select(key, run = null, read = true) {
        selected = { key, run };
        history.replaceState(
          null,
          "",
          "#" + new URLSearchParams(run ? { task: key, run } : { task: key }),
        );
        if (read) document.body.classList.add("reading");
        renderList();
        showTask();
      }

      $("back").addEventListener("click", () => {
        document.body.classList.remove("reading");
        selected = null;
        shown = null;
        source?.close();
        history.replaceState(null, "", location.pathname);
        renderList();
      });

      // The selected entry's title, its runs, and the log of the one shown.
      function showTask() {
        const t = tasks.find((x) => x.key === selected.key);
        if (!t) return;
        const r = (selected.run && t.runs.find((x) => x.id === selected.run)) || t.runs[0];
        const url = link(t);
        $("title").replaceChildren(
          $("back"),
          el("strong", {}, `${t.repo} ${label(t)}`),
          el("span", { class: t.state }, `${dot[t.state] ?? ""} ${STATE_NAMES[t.state]}`),
          r
            ? el(
                "span",
                { class: "when" },
                `${new Date(r.startedAt).toLocaleString()} · ${duration(r)}` +
                  (r.model ? ` · ${r.model}, ${r.effort}` : ""),
              )
            : null,
          url
            ? el("a", { href: url, target: "_blank", rel: "noreferrer" }, `#${t.replyTo} on GitHub`)
            : null,
        );
        $("history").replaceChildren(
          ...(t.runs.length > 1
            ? t.runs.map((x, i) =>
                el(
                  "button",
                  {
                    "aria-current": String(x.id === r.id),
                    title: i === 0 ? "Latest: follows the next runs" : x.id,
                    onclick: () => select(t.key, i === 0 ? null : x.id),
                  },
                  `${dot[x.status] ?? "✕"} ${x.mode ?? "run"} · ${x.status === "running" ? duration(x) : ago(x.startedAt)}`,
                ),
              )
            : []),
        );
        if (!r) {
          shown = null;
          source?.close();
          const text = `Waiting for the first run of ${label(t)} to start…`;
          if (log.textContent !== text)
            log.replaceChildren(el("div", { class: "entry meta" }, text));
          return;
        }
        if (shown !== r.id) open(r);
      }

      const log = $("log");
      let following = true;
      log.addEventListener("scroll", () => {
        following = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
        $("follow").hidden = following;
      });
      $("follow").addEventListener("click", () => {
        following = true;
        log.scrollTop = log.scrollHeight;
      });

      let lastTool = null;
      function render(entry) {
        if (entry.kind === "output" && lastTool) {
          lastTool.append(
            el("pre", { class: `out${entry.error ? " error" : ""}` }, entry.text || "(no output)"),
          );
          if (entry.error) lastTool.open = true;
          return;
        }
        lastTool = null;
        let node;
        if (entry.kind === "text") node = el("div", { class: "entry text" }, entry.text);
        else if (entry.kind === "meta") node = el("div", { class: "entry meta" }, entry.text);
        else if (entry.kind === "raw")
          node = el("div", { class: "entry raw" }, el("pre", {}, entry.text));
        else if (entry.kind === "tool") {
          node = el(
            "details",
            { class: "entry tool" },
            el(
              "summary",
              {},
              el("span", { class: "name" }, entry.name),
              el("pre", {}, entry.text || " "),
            ),
          );
          lastTool = node;
        } else if (entry.kind === "result") {
          node = el(
            "div",
            {
              class: `entry result${entry.status === "ok" ? "" : ` ${entry.status}`}`,
            },
            el(
              "strong",
              {},
              entry.status === "error"
                ? "Failed"
                : `${entry.status === "ok" ? "Done" : "Needs input"} in ${entry.minutes} min`,
            ),
            "\n\n" + entry.text,
          );
        } else if (entry.kind === "output") {
          node = el("div", { class: "entry raw" }, el("pre", {}, entry.text));
        }
        if (node) log.append(node);
      }

      // The run's log so far, then live until it ends.
      function open(r) {
        source?.close();
        shown = r.id;
        log.replaceChildren();
        lastTool = null;
        following = true;
        $("follow").hidden = true;
        source = new EventSource(`api/runs/${encodeURIComponent(r.id)}/stream`);
        source.addEventListener("entries", (event) => {
          for (const entry of JSON.parse(event.data)) render(entry);
          if (following) log.scrollTop = log.scrollHeight;
        });
        source.addEventListener("end", () => source.close());
      }

      refresh();
      setInterval(refresh, 3000);
    </script>
  </body>
</html>
