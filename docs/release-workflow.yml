# Goes in .github/workflows/release.yml (Deckhand's own App can't push workflows: move it by hand).
# Each tag (v1.2.3) publishes the listener, egress proxy and base sandbox images to GHCR as
# ghcr.io/<owner>/deckhand-{listener,egress,sandbox}, tagged 1.2.3, 1.2 and latest
# (a pre-release such as v1.3.0-rc.1: only its own tag). Operators pull them with compose:
# see "Updating" in docs/setup.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: deckhand-listener
            dockerfile: listener/Dockerfile
          - image: deckhand-egress
            dockerfile: proxy/Dockerfile
          - image: deckhand-sandbox
            dockerfile: sandbox/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          # The repository root: the images take ../prompts/ too.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: DECKHAND_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
