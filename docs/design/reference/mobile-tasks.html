<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Deckhand phone — Tasks</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"><style>
body{margin:0}
.t-light{--bg:#F6F7F9;--surface:#FFFFFF;--surface-2:#F0F2F5;--surface-3:#E6E9EE;--border:#E1E4EA;--border-strong:#C5CBD5;--text:#14171F;--text-2:#475061;--text-3:#5F6878;--primary:#14171F;--on-primary:#FFFFFF;--focus:#2563EB;--run:#1D4ED8;--run-bg:#E7EEFD;--run-solid:#3B6FF0;--input:#9A4A06;--input-bg:#FDF0DC;--input-solid:#E8890C;--ready:#6A2DD0;--ready-bg:#F0EAFD;--ready-solid:#8B5CF6;--done:#146C34;--done-bg:#E3F3E8;--done-solid:#22A355;--err:#B42318;--err-bg:#FDEBEA;--err-solid:#C8322A;--idle:#4B5463;--idle-bg:#EDEFF3;--idle-solid:#98A1B0;color-scheme:light}
.t-dark{--bg:#0D0F14;--surface:#151820;--surface-2:#1C2029;--surface-3:#252A35;--border:#262B36;--border-strong:#3A4150;--text:#E9ECF2;--text-2:#B3BAC7;--text-3:#8C95A5;--primary:#E9ECF2;--on-primary:#0D0F14;--focus:#6E9BFF;--run:#8FB1FF;--run-bg:#16213D;--run-solid:#5B86F5;--input:#F4B35E;--input-bg:#33240E;--input-solid:#E8930F;--ready:#C3A6FF;--ready-bg:#271C44;--ready-solid:#9670F5;--done:#6CCF8B;--done-bg:#11281A;--done-solid:#2DA55A;--err:#FF8E86;--err-bg:#3A1614;--err-solid:#C93A31;--idle:#AAB1BE;--idle-bg:#20242D;--idle-solid:#6B7383;color-scheme:dark}
.ui{font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--text);-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.s-run{--s-fg:var(--run);--s-bg:var(--run-bg);--s-solid:var(--run-solid)}
.s-input{--s-fg:var(--input);--s-bg:var(--input-bg);--s-solid:var(--input-solid)}
.s-ready{--s-fg:var(--ready);--s-bg:var(--ready-bg);--s-solid:var(--ready-solid)}
.s-done{--s-fg:var(--done);--s-bg:var(--done-bg);--s-solid:var(--done-solid)}
.s-err{--s-fg:var(--err);--s-bg:var(--err-bg);--s-solid:var(--err-solid)}
.s-idle{--s-fg:var(--idle);--s-bg:var(--idle-bg);--s-solid:var(--idle-solid)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--text-2);cursor:pointer}
.icon-btn:active{background:var(--surface-3)}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--s-solid);flex:none}
.pulse{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--s-solid) 60%,transparent)}100%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;box-sizing:border-box;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font:500 13px/1 Inter,system-ui,sans-serif;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip .n{font:500 12px/1 "JetBrains Mono",monospace;opacity:.7}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;column-gap:12px;row-gap:4px;align-items:center;width:100%;min-height:68px;padding:12px 16px;box-sizing:border-box;border:0;border-bottom:1px solid var(--border);background:var(--surface);color:var(--text);text-align:left;font:inherit;cursor:pointer}
.row:active{background:var(--surface-2)}
.clamp1{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;color:var(--text-3);text-decoration:none;font-size:11px;font-weight:600;position:relative}
.tabbar a[aria-current="page"]{color:var(--text)}
.pip{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:var(--input-solid);color:#14171F;font-size:10px;line-height:16px;text-align:center}
a{color:var(--focus)}
</style></head>
<body>


<div class="ui t-light" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); overflow: hidden">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 6px 8px 8px; background: var(--surface); border-bottom: 1px solid var(--border)">
    <button type="button" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: var(--text); font: 600 17px/1 Inter, system-ui, sans-serif; cursor: pointer">
      <span class="sdot s-run pulse"></span>acme/app
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text-3)"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <span style="flex: 1"></span>
    <button type="button" class="icon-btn" aria-label="Search tasks"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
    <button type="button" class="icon-btn" aria-label="New request"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </header>

  <div role="group" aria-label="State" style="display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; background: var(--surface); border-bottom: 1px solid var(--border)">
    <button type="button" class="chip" aria-pressed="true">All <span class="n">8</span></button>
    <button type="button" class="chip" aria-pressed="false">Needs you <span class="n">2</span></button>
    <button type="button" class="chip" aria-pressed="false">Running <span class="n">3</span></button>
    <button type="button" class="chip" aria-pressed="false">Ready <span class="n">1</span></button>
    <button type="button" class="chip" aria-pressed="false">Error <span class="n">1</span></button>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; margin: 12px 16px 4px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 12.5px; color: var(--text-2)">
    <span style="display: grid; grid-template-columns: repeat(4, 14px); gap: 3px" aria-hidden="true">
      <span style="height: 5px; border-radius: 3px; background: var(--run-solid)"></span>
      <span style="height: 5px; border-radius: 3px; background: var(--run-solid)"></span>
      <span style="height: 5px; border-radius: 3px; background: var(--surface-3)"></span>
      <span style="height: 5px; border-radius: 3px; background: var(--surface-3)"></span>
    </span>
    2 of 4 running · 1 queued
  </div>

  <ul style="list-style: none; margin: 8px 0 0; padding: 0; flex: 1; overflow: auto; border-top: 1px solid var(--border)">
    
      <li>
        <button type="button" class="row">
          <span class="sdot s-input"></span>
          <span class="clamp1" style="font-size: 15px; font-weight: 500">Per-repo budgets: what counts as a run?</span>
          <span style="font-size: 12.5px; color: var(--text-3)">2h</span>
          <span></span>
          <span class="clamp1" style="font-size: 13px; color: var(--text-3)"><span class="mono">#21</span> · 3 questions</span>
          <span class="s-input" style="font-size: 12.5px; font-weight: 600; color: var(--s-fg)">Needs input</span>
        </button>
      </li>
    
      <li>
        <button type="button" class="row">
          <span class="sdot s-input"></span>
          <span class="clamp1" style="font-size: 15px; font-weight: 500">Egress proxy: allow wildcard ports</span>
          <span style="font-size: 12.5px; color: var(--text-3)">3h</span>
          <span></span>
          <span class="clamp1" style="font-size: 13px; color: var(--text-3)"><span class="mono">#20</span> · brainstorm</span>
          <span class="s-input" style="font-size: 12.5px; font-weight: 600; color: var(--s-fg)">Your turn</span>
        </button>
      </li>
    
      <li>
        <button type="button" class="row">
          <span class="sdot s-run"></span>
          <span class="clamp1" style="font-size: 15px; font-weight: 500">Dashboard on a frontend framework, built at image build time</span>
          <span style="font-size: 12.5px; color: var(--text-3)">12m</span>
          <span></span>
          <span class="clamp1" style="font-size: 13px; color: var(--text-3)"><span class="mono">#22</span> · work · Draft #34</span>
          <span class="s-run" style="font-size: 12.5px; font-weight: 600; color: var(--s-fg)">Working</span>
        </button>
      </li>
    
      <li>
        <button type="button" class="row">
          <span class="sdot s-ready"></span>
          <span class="clamp1" style="font-size: 15px; font-weight: 500">Retry failed webhook deliveries with backoff</span>
          <span style="font-size: 12.5px; color: var(--text-3)">1h</span>
          <span></span>
          <span class="clamp1" style="font-size: 13px; color: var(--text-3)"><span class="mono">#19</span> · PR #33</span>
          <span class="s-ready" style="font-size: 12.5px; font-weight: 600; color: var(--s-fg)">Ready</span>
        </button>
      </li>
    
      <li>
        <button type="button" class="row">
          <span class="sdot s-idle"></span>
          <span class="clamp1" style="font-size: 15px; font-weight: 500">Per-repo budgets for runs</span>
          <span style="font-size: 12.5px; color: var(--text-3)">now</span>
          <span></span>
          <span class="clamp1" style="font-size: 13px; color: var(--text-3)"><span class="mono">#23</span> · work</span>
          <span class="s-idle" style="font-size: 12.5px; font-weight: 600; color: var(--s-fg)">Queued</span>
        </button>
      </li>
    
      <li>
        <button type="button" class="row">
          <span class="sdot s-idle"></span>
          <span class="clamp1" style="font-size: 15px; font-weight: 500">Per-repo budgets in the dashboard</span>
          <span style="font-size: 12.5px; color: var(--text-3)">—</span>
          <span></span>
          <span class="clamp1" style="font-size: 13px; color: var(--text-3)"><span class="mono">#24</span> · after #23</span>
          <span class="s-idle" style="font-size: 12.5px; font-weight: 600; color: var(--s-fg)">Waiting</span>
        </button>
      </li>
    
      <li>
        <button type="button" class="row">
          <span class="sdot s-err"></span>
          <span class="clamp1" style="font-size: 15px; font-weight: 500">Bugs</span>
          <span style="font-size: 12.5px; color: var(--text-3)">5h</span>
          <span></span>
          <span class="clamp1" style="font-size: 13px; color: var(--text-3)"><span class="mono">#16</span> · bug report</span>
          <span class="s-err" style="font-size: 12.5px; font-weight: 600; color: var(--s-fg)">Error</span>
        </button>
      </li>
    
      <li>
        <button type="button" class="row">
          <span class="sdot s-done"></span>
          <span class="clamp1" style="font-size: 15px; font-weight: 500">Sandbox image cache across runs</span>
          <span style="font-size: 12.5px; color: var(--text-3)">1d</span>
          <span></span>
          <span class="clamp1" style="font-size: 13px; color: var(--text-3)"><span class="mono">#18</span> · merged #30</span>
          <span class="s-done" style="font-size: 12.5px; font-weight: 600; color: var(--s-fg)">Done</span>
        </button>
      </li>
    
  </ul>

  <nav class="tabbar" aria-label="Pages" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 4px 8px 18px; background: var(--surface); border-top: 1px solid var(--border)">
    <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Overview<span class="pip">3</span></a>
    <a href="#" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg>Tasks</a>
    <a href="mobile-board.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5"></rect><rect x="15" y="3" width="6" height="6" rx="1.5"></rect><rect x="15" y="15" width="6" height="6" rx="1.5"></rect><path d="M9 6h6M18 9v6"></path></svg>Board</a>
    <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Settings</a>
  </nav>
</div>




</body></html>
