# Deckhand's settings: copy to config.yaml (git-ignored here; commit it in your own
# deployment's repository) and uncomment the line that mounts it in compose.yaml.
# Each key is a setting's environment variable in lowercase; a variable set (non-empty) in
# .env wins over it. Read at start: restart the listener after an edit. Secrets stay in
# .env. Every key: docs/setup.md#settings.

# GitHub logins allowed to start runs (required, here or in ALLOWED_USERS).
allowed_users:
  - your-github-login
# Only these repos, among those where the App is installed. Empty: all of them.
allowed_repos: []
# Hosts every sandbox may reach besides Anthropic and GitHub (*.domain and * work).
allowed_hosts: []

trigger: Deckhand
sandbox_model: opus
# Through an Anthropic-compatible gateway (docs/setup.md#through-a-gateway), with
# ANTHROPIC_AUTH_TOKEN in .env:
# anthropic_base_url: https://openrouter.ai/api
# anthropic_default_opus_model: anthropic/claude-opus-4.1
# anthropic_default_sonnet_model: anthropic/claude-sonnet-4.5
# anthropic_default_haiku_model: anthropic/claude-haiku-4.5
sandbox_effort: medium
max_parallel: 2

# Each sandbox's limits; the grants folder can set them per repo.
sandbox_cpus: 2
sandbox_memory: 4g
sandbox_pids: 2048

# A container engine next to the sandboxes of repositories granted allow_docker: sysbox,
# podman or auto (docs/setup.md#container-engine). None by default.
# sandbox_engine: sysbox

conflict_check_minutes: 5
waits_check_minutes: 5
onboarding: true
