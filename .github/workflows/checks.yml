name: Checks

# AGENTS.md's checks, on every pull request and push to main: one job each, so a failure says
# which. GitHub-hosted runners, so a fork's pull request runs on a throwaway machine, with nothing
# to take: read-only contents, no secret.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    # As the runner's own user, not root: the tests that need a directory root could write
    # anyway run here (they skip as root, below).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real Redis, so the store's Redis tests run (test/store-redis.test.mjs, its calls made as
    # docs/guides/store.md's ACL users, and the runner's handover on Redis): Redis 7, the oldest
    # docs/guides/store.md supports.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      # Two commits deep: the size ratchet (#1065, test/file-sizes.test.mjs) compares the files
      # with the merge commit's first parent, main as the pull request merges into it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The real opa, so its tests don't skip: the version and sha256 policy-service/Dockerfile
      # pins, read from it, so the two can't differ. Through the API with the job's token: GitHub
      # throttles anonymous release downloads first when it is under load (504s and 503s).
      - name: Install opa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dockerfile=policy-service/Dockerfile
          version=$(sed -n 's/^ARG OPA_VERSION=//p' "$dockerfile")
          sum=$(sed -n 's/^ *amd64) sum=\([0-9a-f]*\) ;;.*/\1/p' "$dockerfile")
          test -n "$version" && test -n "$sum"
          gh release download "v${version}" -R open-policy-agent/opa -p opa_linux_amd64_static -O "$RUNNER_TEMP/opa"
          echo "$sum  $RUNNER_TEMP/opa" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$RUNNER_TEMP/opa" "$RUNNER_TEMP/bin/opa"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: opa version && jq --version && id
      - name: Bundle graphql-js
        working-directory: listener/vendor
        run: npm ci --no-audit --no-fund && npm run build
      # Fails, too, when a real-opa or Redis test skipped: opa is on the PATH, Redis beside; or
      # the size ratchet's, its base checked out above.
      - name: Tests
        env:
          TEST_REDIS_URL: redis://localhost:6379
          FILE_SIZES_BASE: HEAD^1
        run: |
          node --test --test-force-exit --import ./test/blocking-stdout.mjs --test-timeout=120000 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/tests.tap"
          if grep "# SKIP no opa on the PATH" "$RUNNER_TEMP/tests.tap"; then
            echo "::error::real-opa tests skipped"
            exit 1
          fi
          if grep "# SKIP no Redis" "$RUNNER_TEMP/tests.tap"; then
            echo "::error::Redis tests skipped"
            exit 1
          fi
          if grep "# SKIP no base to compare with" "$RUNNER_TEMP/tests.tap"; then
            echo "::error::the size ratchet skipped"
            exit 1
          fi

  # The same suite as root, in node:26, as `docker run node:26` runs it: a test that only passes
  # as a user who can't write somewhere fails here, unless it skips as root with its reason
  # (test/helpers.mjs isRoot).
  tests-root:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # --init: a PID 1 that reaps orphans. The runner's own (`tail -f /dev/null`) leaves them
    # zombies, which the fake docker's `logs` waits on forever (`kill -0` finds them alive).
    container:
      image: node:26
      options: --user 0 --init
    # The same Redis, reached by its name on the job's network.
    services:
      redis:
        image: redis:7
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_REDIS_URL: redis://redis:6379
    steps:
      - uses: actions/checkout@v4
      # opa through the API with the job's token, as `tests` does; node:26 has no gh, so curl and
      # jq. The asset's redirect goes to another host, where curl drops the token.
      - name: Install jq and opa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get update -qq && apt-get install -y -qq jq
          dockerfile=policy-service/Dockerfile
          version=$(sed -n 's/^ARG OPA_VERSION=//p' "$dockerfile")
          sum=$(sed -n 's/^ *amd64) sum=\([0-9a-f]*\) ;;.*/\1/p' "$dockerfile")
          test -n "$version" && test -n "$sum"
          asset=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/open-policy-agent/opa/releases/tags/v${version}" |
            jq -er '.assets[] | select(.name == "opa_linux_amd64_static") | .url')
          curl -fsSLo /tmp/opa -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$asset"
          echo "$sum  /tmp/opa" | sha256sum -c -
          install -m 755 /tmp/opa /usr/local/bin/opa
      - run: opa version && jq --version && id && test "$(id -u)" = 0
      - name: Bundle graphql-js
        working-directory: listener/vendor
        run: npm ci --no-audit --no-fund && npm run build
      - name: Tests
        run: |
          node --test --test-force-exit --import ./test/blocking-stdout.mjs --test-timeout=120000 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=/tmp/tests.tap
          if grep "# SKIP no opa on the PATH" /tmp/tests.tap; then
            echo "::error::real-opa tests skipped"
            exit 1
          fi
          if grep "# SKIP no Redis" /tmp/tests.tap; then
            echo "::error::Redis tests skipped"
            exit 1
          fi

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  # The docs site (docs/, VitePress): its build, and every page's anchors as GitHub's, rendered
  # as the site renders them (test/docs-links.test.mjs, which skips without docs/node_modules).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - working-directory: docs
        run: npm ci --no-audit --no-fund && npm run build
      - run: node --test test/docs-links.test.mjs

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: node --check
        run: |
          node --check edge/server.mjs orchestrator/server.mjs runner/server.mjs broker/server.mjs github/server.mjs models/server.mjs
          node --check policy-service/service.mjs machine/deckhand-machine.mjs cli/deckhand.mjs sandbox/deckhand-inbox sandbox/deckhand-files sandbox/deckhand-tagged sandbox/deckhand-permissions
          # deploy/kubernetes's one script, by a glob: the workflow gate refuses its name.
          for f in deploy/kubernetes/*.mjs; do node --check "$f"; done
          node --check deploy/kubernetes-e2e/fakes.mjs
      - name: sh -n
        run: sh -n deploy/kubernetes/check-isolation.sh
      - name: bash -n
        run: |
          for f in sandbox/*.sh sandbox/agents/*.sh sandbox/agents/claude/install \
            sandbox/agents/codex/install sandbox/agents/antigravity/install \
            sandbox/agents/antigravity/refresh sandbox/agents/npm-install \
            sandbox/agents/release-install sandbox/deckhand-token sandbox/gh \
            sandbox/git-credential-deckhand sandbox/pre-push engine/entrypoint.sh \
            test/fixtures/fake-docker.sh test/fixtures/fake-opa.sh test/fixtures/fake-kubectl.sh \
            deploy/kubernetes-e2e/run.sh; do
            bash -n "$f" || exit 1
          done

  # deploy/kubernetes rendered by kustomize, alone and with each component, and every object
  # checked against Kubernetes' schemas (#396). test/kubernetes-manifests.test.mjs reads the files
  # as written; a broken generator or patch only shows here. The Helm chart (deploy/helm/deckhand,
  # #570) too, and held to the base: test/helm-chart.test.mjs, which needs helm and kustomize. The
  # end-to-end check's overlay as well (#676).
  # The tools pinned by version and sha256, as opa is, rather than whichever versions the runner's
  # image happens to carry.
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.+)$
      KUSTOMIZE_VERSION: 5.8.3
      KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
      # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.+)$
      KUBECONFORM_VERSION: 0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # renovate: datasource=github-releases depName=helm/helm extractVersion=^v(?<version>.+)$
      HELM_VERSION: 4.3.1
      HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
      # promtool, for the alert rules: Prometheus' release, the one docs/guides/metrics.md's example runs.
      # renovate: datasource=github-releases depName=prometheus/prometheus extractVersion=^v(?<version>.+)$
      PROMETHEUS_VERSION: 3.15.1
      PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # GitHub's releases through the API with the job's token, as opa is (helm's are its own host).
      - name: Install kustomize, kubeconform, helm and promtool
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "kustomize/v${KUSTOMIZE_VERSION}" -R kubernetes-sigs/kustomize -p "kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -O kustomize.tgz
          gh release download "v${KUBECONFORM_VERSION}" -R yannh/kubeconform -p kubeconform-linux-amd64.tar.gz -O kubeconform.tgz
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          gh release download "v${PROMETHEUS_VERSION}" -R prometheus/prometheus -p "prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" -O prometheus.tgz
          printf '%s  kustomize.tgz\n%s  kubeconform.tgz\n%s  helm.tgz\n%s  prometheus.tgz\n' "$KUSTOMIZE_SHA256" "$KUBECONFORM_SHA256" "$HELM_SHA256" "$PROMETHEUS_SHA256" | sha256sum -c -
          mkdir -p bin
          tar -xzf kustomize.tgz -C bin kustomize
          tar -xzf kubeconform.tgz -C bin kubeconform
          tar -xzf helm.tgz -C bin --strip-components 1 linux-amd64/helm
          tar -xzf prometheus.tgz -C bin --strip-components 1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: kustomize version && kubeconform -v && helm version && promtool --version
      # An overlay per combination, outside the repository as an operator's would be, with
      # relative paths: kustomize refuses an absolute one. pipefail: a kustomize that fails gives
      # kubeconform nothing, which it would pass.
      - name: Render and validate
        run: |
          set -o pipefail
          for combination in "" redis buildkit engine blobs "redis buildkit" "redis buildkit engine blobs"; do
            overlay=$(mktemp -d -p "$RUNNER_TEMP")
            base=$(realpath --relative-to="$overlay" "$GITHUB_WORKSPACE/deploy/kubernetes")
            printf 'resources: [%s]\n' "$base" > "$overlay/kustomization.yaml"
            components=""
            for c in $combination; do components="$components${components:+, }$base/components/$c"; done
            if [ -n "$components" ]; then
              printf 'components: [%s]\n' "$components" >> "$overlay/kustomization.yaml"
            fi
            echo "base${combination:+ with $combination}:"
            kustomize build --load-restrictor LoadRestrictionsNone "$overlay" | kubeconform -strict -summary
          done
      # The end-to-end check's overlay (deploy/kubernetes-e2e, #676): a change to the base that
      # breaks it shows here, not in the next run of run.sh. The test holds it to run.sh's guard
      # and checks its patches landed, which kustomize skips without a word when their target
      # is gone; it fails the job when it skips: kustomize is on the PATH here.
      - name: End-to-end overlay
        run: |
          set -o pipefail
          kustomize build deploy/kubernetes-e2e | kubeconform -strict -summary
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/e2e.tap" test/kubernetes-e2e-overlay.test.mjs
          if grep "# SKIP" "$RUNNER_TEMP/e2e.tap"; then
            echo "::error::e2e overlay tests skipped"
            exit 1
          fi
      # The chart: its default values and each component's, then every value set. The test fails
      # when it skips: helm and kustomize are on the PATH here.
      - name: Helm chart
        run: |
          set -o pipefail
          chart=deploy/helm/deckhand
          helm lint --strict "$chart"
          for values in "" "store=redis" "buildkit.enabled=true" "engine.enabled=true" \
            "blobs.enabled=true" "store=redis,buildkit.enabled=true,engine.enabled=true,blobs.enabled=true"; do
            echo "chart${values:+ with $values}:"
            helm template deckhand "$chart" ${values:+--set "$values"} | kubeconform -strict -summary
          done
          echo "chart with every value:"
          helm template deckhand "$chart" --set store=redis,buildkit.enabled=true,engine.enabled=true,blobs.enabled=true \
            --set image.tag=v1.2.3,persistence.storageClass=ssd,sandboxes.storageClass=ssd \
            --set registry.url=registry.example.com/deckhand,ingress.enabled=true \
            --set ingress.host=deckhand.example.com,ingress.tlsSecretName=deckhand-tls \
            --set metrics.dashboard.enabled=true \
            | kubeconform -strict -summary
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/helm.tap" test/helm-chart.test.mjs
          if grep "# SKIP" "$RUNNER_TEMP/helm.tap"; then
            echo "::error::helm chart tests skipped"
            exit 1
          fi
      # The alert rules (deploy/alerts), which the chart's PrometheusRule carries: they parse, and
      # each fires on what its test says.
      - name: Alert rules
        run: |
          promtool check rules deploy/alerts/deckhand.yaml
          promtool test rules deploy/alerts/deckhand.test.yaml

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npx --yes prettier@3 --check .
