name: Release

# A commit on main gets its `edge` images once Checks passed on it, never before: a red main
# (two pull requests green apart and broken together) would otherwise reach the deployments that
# follow `edge`. Only main's newest commit is published: Checks run again on an older one
# (a flaky test's rerun) would move `edge` back over a newer commit, whose own Checks publish it.
# A release tag (v*) is published as it is pushed: it names a commit of main, cut by hand.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

# On main, a publish cancels the one in progress (a newer commit wins); a tag's never is. Every
# Checks run that completes on a branch named main starts a Release run, failed, cancelled or a
# fork's: concurrency applies before the job's `if` (below, the same condition), so those get a
# group of their own, their run's, and only the runs that will publish share one. Otherwise a
# failed run's Release would cancel the publish of the commit before it, which passed.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      (github.event_name == 'push' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_sha == github.sha))
      && 'publish' || github.run_id }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read
  packages: write

jobs:
  # The machine driver is one file, attached to each release (docs/setup.md, Your own machine),
  # its VERSION the tag's so register_machine and heartbeat report the release.
  machine-driver:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          line="export const VERSION = \"$version\";"
          sed -i "s|^export const VERSION = \".*\";\$|$line|" machine/deckhand-machine.mjs
          # A driver whose VERSION line moved would ship saying 0.1.0: fail rather than that.
          grep -qxF "$line" machine/deckhand-machine.mjs
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" machine/deckhand-machine.mjs --clobber

  images:
    # Checks passed on a push to this repository's main (`branches` alone also matches a fork's
    # pull request from a branch named main, whose code must never be built with this token), on
    # main's newest commit (a workflow_run's github.sha): the concurrency group above, the same.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: deckhand-edge
            dockerfile: edge/Dockerfile
          - image: deckhand-orchestrator
            dockerfile: orchestrator/Dockerfile
          - image: deckhand-broker
            dockerfile: broker/Dockerfile
          - image: deckhand-github
            dockerfile: github/Dockerfile
          - image: deckhand-runner
            dockerfile: runner/Dockerfile
          - image: deckhand-egress
            dockerfile: proxy/Dockerfile
          - image: deckhand-models
            dockerfile: models/Dockerfile
          - image: deckhand-policy
            dockerfile: policy-service/Dockerfile
          - image: deckhand-sandbox
            dockerfile: sandbox/Dockerfile
          - image: deckhand-engine
            dockerfile: engine/Dockerfile
          - image: deckhand-engine-podman
            dockerfile: engine/podman/Dockerfile
    # The commit Checks passed on, main's newest (the `if` above): named once, from the event.
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      # arm64, on a tag, through QEMU: the runners are amd64.
      - if: github.ref_type == 'tag'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # The semver tags produce nothing but on a tag, edge nothing but after Checks on main.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_run' }}
          # The commit built, which the action would take from github.sha otherwise.
          labels: |
            org.opencontainers.image.revision=${{ env.COMMIT }}
      # The version the dashboard shows: the release's, or edge-<short sha> to tell commits apart.
      - id: version
        env:
          RELEASE: ${{ steps.meta.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$RELEASE" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge-${COMMIT::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          # DECKHAND_SOURCE: the dashboard links the version to its commit or release there.
          build-args: |
            DECKHAND_VERSION=${{ steps.version.outputs.version }}
            DECKHAND_SOURCE=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
