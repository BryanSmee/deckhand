# Goes in .github/workflows/release-workflow.yml (Deckhand's own App can't push workflows: move it
# by hand). Publishes the listener, egress proxy and base sandbox images to GHCR as
# ghcr.io/<owner>/deckhand-{listener,egress,sandbox}:
# - each tag (v1.2.3): tagged 1.2.3, 1.2 and latest, for amd64 and arm64 (a pre-release such
#   as v1.3.0-rc.1: only its own tag);
# - each push to main: tagged edge, amd64 only, showing edge-<short sha> as its version. It
#   builds straight away, and a newer push cancels it: a burst of merges ends with one build of
#   the last commit.
# Operators pull them with compose: see "Updating" in docs/setup.md.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

# A newer push to main cancels the edge build still pending or running (GitHub keeps at most
# one pending run per group); a release (its own ref, never a branch) is never cancelled. No
# job sleeps to debounce: a sleeping job holds a runner, and its minutes are billed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: deckhand-listener
            dockerfile: listener/Dockerfile
          - image: deckhand-egress
            dockerfile: proxy/Dockerfile
          - image: deckhand-sandbox
            dockerfile: sandbox/Dockerfile
    steps:
      - uses: actions/checkout@v4
      # Only releases build arm64, through QEMU: edge skips most of the compute.
      - if: github.ref_type == 'tag'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # The semver tags produce nothing on a branch push, edge nothing on a tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
      # The version the dashboard shows: the release's, or edge-<short sha> to tell commits apart.
      - id: version
        env:
          RELEASE: ${{ steps.meta.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$RELEASE" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          # The repository root: the images take ../prompts/ too.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          build-args: DECKHAND_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per image; edge builds warm the cache for the next release.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
