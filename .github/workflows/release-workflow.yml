name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      # An image whose Dockerfile isn't in the commit builds nothing (#558): a service's is listed
      # before its pull request adds it, which then changes no workflow, and the listener's stays
      # until no release needs it.
      matrix:
        include:
          - image: deckhand-edge
            dockerfile: edge/Dockerfile
          - image: deckhand-orchestrator
            dockerfile: orchestrator/Dockerfile
          - image: deckhand-listener
            dockerfile: listener/Dockerfile
          - image: deckhand-broker
            dockerfile: broker/Dockerfile
          - image: deckhand-github
            dockerfile: github/Dockerfile
          - image: deckhand-runner
            dockerfile: runner/Dockerfile
          - image: deckhand-egress
            dockerfile: proxy/Dockerfile
          - image: deckhand-models
            dockerfile: models/Dockerfile
          - image: deckhand-policy
            dockerfile: policy-service/Dockerfile
          - image: deckhand-sandbox
            dockerfile: sandbox/Dockerfile
          - image: deckhand-engine
            dockerfile: engine/Dockerfile
          - image: deckhand-engine-podman
            dockerfile: engine/podman/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: dockerfile
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
        run: |
          if [ -f "$DOCKERFILE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$DOCKERFILE isn't in this commit: $IMAGE isn't built"
          fi
      - if: steps.dockerfile.outputs.found == 'true'
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - if: steps.dockerfile.outputs.found == 'true' && (github.ref_type == 'tag' || runner.arch != 'X64')
        uses: docker/setup-qemu-action@v3
      - if: steps.dockerfile.outputs.found == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.dockerfile.outputs.found == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.dockerfile.outputs.found == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # The semver tags produce nothing on a branch push, edge nothing on a tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
      # The version the dashboard shows: the release's, or edge-<short sha> to tell commits apart.
      - if: steps.dockerfile.outputs.found == 'true'
        id: version
        env:
          RELEASE: ${{ steps.meta.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$RELEASE" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.dockerfile.outputs.found == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          build-args: DECKHAND_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
