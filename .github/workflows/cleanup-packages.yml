name: Clean up packages

# Every push to main publishes an edge image per package, and the registry's storage fills up.
# Run by hand to delete all but the newest versions of each image.
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Versions to keep per image (an image is several versions: index, manifests, attestations)"
        default: "10"

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      # An image not published yet (its service listed ahead, #558) is skipped.
      matrix:
        image:
          - deckhand-broker
          - deckhand-edge
          - deckhand-egress
          - deckhand-engine
          - deckhand-engine-podman
          - deckhand-github
          - deckhand-listener
          - deckhand-models
          - deckhand-orchestrator
          - deckhand-policy
          - deckhand-runner
          - deckhand-sandbox
    steps:
      # Whether the owner (a user's or an organization's) has the package yet.
      - id: package
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          for kind in users orgs; do
            if curl -fsS -o /dev/null -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/$kind/$OWNER/packages/container/$IMAGE" 2> /dev/null; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "::notice::no package $IMAGE yet: nothing to clean up"
      # Not delete-only-untagged-versions: a multi-platform image's manifests are untagged
      # versions too, and deleting them breaks the tag that points at them.
      - if: steps.package.outputs.found == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: ${{ inputs.keep }}
