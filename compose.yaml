# What an operator runs: edge, the orchestrator, the runner, the broker service, the github
# service, the models service, the policy service, the egress proxy, and the sandbox image runs
# start from. Each sandbox sits on an internal network of its own, which the runner creates and
# joins the orchestrator and the egress proxy to: the proxy is their only way out (see
# docs/security.md). Edge is the only one the internet reaches, with the webhook secret and the
# sessions' key alone; the orchestrator holds no secret; the runner is the only one with the
# Docker socket, the github service the only one with the GitHub App's key, the models service
# the only one with the agents' credentials. Every network but edge's and the services' ways
# out is internal, each shared by a service and its callers alone.
#
#   cp .env.example .env    # then set a Claude credential (and ALLOWED_USERS, or in config.yaml)
#   cp -r server.example server   # your settings and grants, mounted below: keep it in git
#   docker compose pull && docker compose up -d
#   docker compose logs edge   # prints the one-time /setup link
#
# The images are the release DECKHAND_VERSION (default: the latest), published for each tag,
# or `edge` (amd64 only), published for each push to main.
# Updating is the same two commands, at any time: running sandboxes go on, and the new
# orchestrator and runner pick them up. `docker compose up -d --build` builds
# them from this checkout instead. Edge's port is published as is: put your own reverse proxy
# (TLS, host name) in front of it. See docs/setup.md.

name: deckhand

# The base image sandboxes run from: the `sandbox` service below pulls or builds it, the
# orchestrator starts runs from it (through the runner).
x-sandbox-image: &sandbox-image ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-sandbox:${DECKHAND_VERSION:-latest}
# The container engines runs of repositories granted `docker` get (SANDBOX_ENGINE): the
# `engine` profile pulls or builds them (COMPOSE_PROFILES=engine in .env), docs/setup.md.
x-engine-image: &engine-image ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-engine:${DECKHAND_VERSION:-latest}
x-engine-podman-image: &engine-podman-image ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-engine-podman:${DECKHAND_VERSION:-latest}

services:
  # The only service the internet reaches (#506, docs/services.md): GitHub's webhooks (their HMAC
  # checked, each taken once, put on the stream the orchestrator reads), /setup, sign-in and the
  # dashboard, whose API it passes on to the orchestrator with the signed-in user. It holds the
  # webhook secret, the session key and the OAuth client's (its own volume), nothing else.
  edge:
    build:
      context: .
      dockerfile: edge/Dockerfile
    image: ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-edge:${DECKHAND_VERSION:-latest}
    restart: unless-stopped
    # Stopping lets the requests in flight finish (a live log, until the browser reconnects):
    # deliveries refused meanwhile are asked again by the next copy's redeliveries.
    stop_grace_period: 30s
    ports:
      - "${PORT:-8080}:8080"
    depends_on: [broker, github]
    # Its way in and out (webhooks, browsers, GitHub's sign-in) on a network of its own, not the
    # proxy's `default`; its networks to the orchestrator, to the broker (its service tokens) and
    # to the github service (/setup's conversion, the redeliveries).
    networks: [edge-out, edge-orchestrator, broker-edge, github-edge]
    environment:
      # Who may sign in to the dashboard, as for runs (or in config.yaml): required.
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      # Optional: /setup detects it from your browser's address and stores it.
      PUBLIC_URL: ${PUBLIC_URL:-}
      GITHUB_URL: ${GITHUB_URL:-}
      GITHUB_API: ${GITHUB_API:-}
      # Wiring, environment only: the orchestrator, which answers the dashboard's API; the
      # github service; the broker, its service tokens and their keys.
      ORCHESTRATOR_URL: http://orchestrator:8083
      GITHUB_SERVICE_URL: http://github:8080
      BROKER_SERVICE_URL: http://broker:8081
      # Who calls its internal port, by the network a call arrives on: the orchestrator.
      SERVICE_NETWORKS: orchestrator=${EDGE_ORCHESTRATOR_SUBNET:-10.231.250.192/28}
    volumes:
      # The App's credentials but its key (app.json: the webhook secret, the OAuth client's),
      # the session key, its store (the deliveries taken, the sessions' sign-outs, the stream to
      # the orchestrator): this volume alone.
      - edge-data:/data
      # Your configuration, read only: config.yaml (allowed_users, public_url).
      - ${DECKHAND_SERVER_DIR:-./server}:/etc/deckhand:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The queue and the runs' lives (#506): it reads the deliveries edge verified, has the runner
  # start the sandboxes, posts their replies through the github service, and answers the
  # dashboard's API. It holds no secret. Two copies may run, one acting and the other waiting for
  # its lease (docs/services.md); with Compose, one.
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    image: ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-orchestrator:${DECKHAND_VERSION:-latest}
    restart: unless-stopped
    # Stopping saves the queue and the runs' state (sandboxes keep running), releases its lease,
    # and lets the sandboxes' calls in flight finish (agents' streams, pushes). New ones the
    # egress proxy relays wait for the next copy (docs/architecture.md#restarts).
    stop_grace_period: 5m
    # The broker service signs the runs' tokens: the orchestrator asks it for them as runs start.
    # Every policy decision goes to the policy service, every GitHub call to the github service,
    # the deliveries come from edge, and the orchestrator asks the models service which agents'
    # credentials it holds before it reads its settings: started first.
    depends_on: [broker, policy, github, models, edge]
    # No way out: its networks to the broker, the runner, the github service, the policy
    # service, the models service, edge and the egress proxy (docs/security.md#the-services-networks).
    networks:
      broker-orchestrator:
      runner:
      github-orchestrator:
      policy:
      models-orchestrator:
      edge-orchestrator:
      # The proxy reaches it there as `listener` too, the name sandboxes call it by (BROKER_URL).
      orchestrator-proxy:
        aliases: [listener]
    environment:
      # Every setting but the secrets and the wiring below can be in config.yaml instead
      # (docs/setup.md#settings). A variable set here, non-empty, wins over the file's key:
      # these pass .env's value, or nothing, so that the file's keys and the orchestrator's
      # defaults apply.
      # Required, here or in config.yaml: GitHub logins allowed to start runs
      # (comma-separated). Empty: no start.
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      # Optional: only these repos (owner/repo, comma-separated), among those where the App
      # is installed. Empty: all of them.
      ALLOWED_REPOS: ${ALLOWED_REPOS:-}
      # The agents' credentials are the models service's (below): the orchestrator asks it which
      # it holds, never for their values.
      # Optional, with a gateway: its names for opus, sonnet and haiku.
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${ANTHROPIC_DEFAULT_OPUS_MODEL:-}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      # Optional: Claude Code's own --fallback-model, when the run's model is overloaded.
      CLAUDE_FALLBACK_MODEL: ${CLAUDE_FALLBACK_MODEL:-}
      # Optional: the models best, balanced and fast stand for with Codex.
      CODEX_BEST_MODEL: ${CODEX_BEST_MODEL:-}
      CODEX_BALANCED_MODEL: ${CODEX_BALANCED_MODEL:-}
      CODEX_FAST_MODEL: ${CODEX_FAST_MODEL:-}
      # Optional: the models best, balanced and fast stand for with the Antigravity CLI.
      AGY_BEST_MODEL: ${AGY_BEST_MODEL:-}
      AGY_BALANCED_MODEL: ${AGY_BALANCED_MODEL:-}
      AGY_FAST_MODEL: ${AGY_FAST_MODEL:-}
      # Where a run goes when its provider fails (or fallbacks in config.yaml,
      # docs/setup.md#fallbacks).
      FALLBACKS: ${FALLBACKS:-}
      # Optional: OpenRouter's names for opus, sonnet and haiku.
      OPENROUTER_OPUS_MODEL: ${OPENROUTER_OPUS_MODEL:-}
      OPENROUTER_SONNET_MODEL: ${OPENROUTER_SONNET_MODEL:-}
      OPENROUTER_HAIKU_MODEL: ${OPENROUTER_HAIKU_MODEL:-}
      # The agent of work runs, and of light runs (empty: SANDBOX_AGENT): claude, codex or
      # antigravity.
      SANDBOX_AGENT: ${SANDBOX_AGENT:-}
      BRAINSTORM_AGENT: ${BRAINSTORM_AGENT:-}
      CODEX_VERSION: ${CODEX_VERSION:-}
      AGY_VERSION: ${AGY_VERSION:-}
      # x64:<sha256>,arm64:<sha256> of its release's tarballs: needed with another AGY_VERSION.
      AGY_SHA256: ${AGY_SHA256:-}
      # Optional: /setup detects it from your browser's address and stores it (at edge).
      PUBLIC_URL: ${PUBLIC_URL:-}
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
      SANDBOX_MODEL: ${SANDBOX_MODEL:-}
      SANDBOX_EFFORT: ${SANDBOX_EFFORT:-}
      # `allowed`: `/speed fast` turns on Claude Code's fast mode (Opus, faster, pricier).
      SANDBOX_FAST_MODE: ${SANDBOX_FAST_MODE:-}
      # Brainstorms, inbox entries and discussions. Empty: SANDBOX_MODEL, SANDBOX_EFFORT.
      BRAINSTORM_MODEL: ${BRAINSTORM_MODEL:-}
      BRAINSTORM_EFFORT: ${BRAINSTORM_EFFORT:-}
      MAX_PARALLEL: ${MAX_PARALLEL:-}
      # Slots within MAX_PARALLEL for the issues labelled AUTO_PICKUP_LABEL (auto-pickup), which
      # the orchestrator starts by itself in the repos that opt in. Empty: 0, off.
      AUTO_PICKUP_SLOTS: ${AUTO_PICKUP_SLOTS:-}
      AUTO_PICKUP_LABEL: ${AUTO_PICKUP_LABEL:-}
      # What every sandbox may reach and its limits: grants/default.yaml, below.
      # A container engine for repos granted `docker`: sysbox, podman or auto. Empty: none.
      SANDBOX_ENGINE: ${SANDBOX_ENGINE:-}
      # A range for the runs' networks (10.200.0.0/16), in blocks of SANDBOX_SUBNET_SIZE
      # (28). Empty: Docker's default address pools.
      SANDBOX_SUBNETS: ${SANDBOX_SUBNETS:-}
      SANDBOX_SUBNET_SIZE: ${SANDBOX_SUBNET_SIZE:-}
      TRIGGER: ${TRIGGER:-}
      ONBOARDING: ${ONBOARDING:-}
      BRAINSTORM_IDLE_MINUTES: ${BRAINSTORM_IDLE_MINUTES:-}
      # No value: passed only when .env sets it, where empty means no label.
      NEEDS_INPUT_LABEL:
      # Shortest interval at which repos that opt in are checked for conflicts (0: off).
      CONFLICT_CHECK_MINUTES: ${CONFLICT_CHECK_MINUTES:-}
      # The most fix runs a repo's `review.fix` may ask for per pull request (5).
      MAX_FIX_ROUNDS: ${MAX_FIX_ROUNDS:-}
      # How often comments waiting for other issues ("/after #77") ask GitHub again.
      WAITS_CHECK_MINUTES: ${WAITS_CHECK_MINUTES:-}
      # Megabytes a run's log may hold: past it, the run is stopped as failed.
      RUN_LOG_MAX_MB: ${RUN_LOG_MAX_MB:-}
      # Days a run's log, summary and screenshots are kept (0: forever).
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-}
      NAME_PREFIX: ${NAME_PREFIX:-}
      CLAUDE_CODE_VOLUME: ${CLAUDE_CODE_VOLUME:-}
      CODEX_VOLUME: ${CODEX_VOLUME:-}
      AGY_VOLUME: ${AGY_VOLUME:-}
      # Advanced (docs/setup.md#advanced-settings).
      GRANTS_DIR: ${GRANTS_DIR:-}
      INSTALL_NETWORK: ${INSTALL_NETWORK:-}
      RUNNER: ${RUNNER:-}
      KUBERNETES_NAMESPACE: ${KUBERNETES_NAMESPACE:-}
      KUBERNETES_PENDING_MINUTES: ${KUBERNETES_PENDING_MINUTES:-}
      KUBERNETES_STORAGE_CLASS: ${KUBERNETES_STORAGE_CLASS:-}
      KUBERNETES_SESSION_SIZE: ${KUBERNETES_SESSION_SIZE:-}
      KUBERNETES_REGISTRY: ${KUBERNETES_REGISTRY:-}
      KUBERNETES_REGISTRY_SECRET: ${KUBERNETES_REGISTRY_SECRET:-}
      KUBERNETES_BUILDKIT: ${KUBERNETES_BUILDKIT:-}
      KUBERNETES_REGISTRY_HOSTS: ${KUBERNETES_REGISTRY_HOSTS:-}
      KUBERNETES_CACHE_STORAGE_CLASS: ${KUBERNETES_CACHE_STORAGE_CLASS:-}
      KUBERNETES_CACHE_SIZE: ${KUBERNETES_CACHE_SIZE:-}
      KUBERNETES_AGENT_STORAGE_CLASS: ${KUBERNETES_AGENT_STORAGE_CLASS:-}
      KUBERNETES_AGENT_SIZE: ${KUBERNETES_AGENT_SIZE:-}
      DEBOUNCE_MS: ${DEBOUNCE_MS:-}
      BRAINSTORM_DEBOUNCE_MS: ${BRAINSTORM_DEBOUNCE_MS:-}
      CONFLICT_MERGE_DELAY_MS: ${CONFLICT_MERGE_DELAY_MS:-}
      GITHUB_URL: ${GITHUB_URL:-}
      GITHUB_API: ${GITHUB_API:-}
      # Wiring, environment only. Names of what the orchestrator creates on the host's Docker
      # (through the runner), matching the ones below.
      SANDBOX_IMAGE: *sandbox-image
      ENGINE_IMAGE: *engine-image
      ENGINE_PODMAN_IMAGE: *engine-podman-image
      # How sandboxes reach its gateways: through the egress proxy, which forwards their calls
      # to it under the name `listener`.
      BROKER_URL: http://listener:8081
      # The broker service, which signs the runs' tokens (#505).
      BROKER_SERVICE_URL: http://broker:8081
      # The github service, the only one with the GitHub App's key (#502): every GitHub call of
      # the orchestrator's goes there.
      GITHUB_SERVICE_URL: http://github:8080
      # The models service, which holds the agents' credentials (#504).
      MODELS_SERVICE_URL: http://models:8080
      # Edge's internal port: the verified deliveries, the App's public parts.
      EDGE_URL: http://edge:8083
      # Their only way out: the egress service below (its deckhand.role label), joined the same
      # way.
      EGRESS_PROXY: http://egress:3128
      # Where every policy decision is evaluated: the policy service below, which checks the
      # orchestrator's service tokens with the broker's public key.
      POLICY_SERVICE_URL: http://policy:8181
      # The runner below. Who calls its services port (8083), by the network a call arrives on:
      # the runner (a run's first tokens) and edge (the dashboard's API).
      RUNNER_URL: http://runner:8080
      SERVICE_NETWORKS: runner=${RUNNER_SUBNET:-10.231.250.48/28},edge=${EDGE_ORCHESTRATOR_SUBNET:-10.231.250.192/28}
    volumes:
      # Its state: the runs' summaries, queue and brainstorm state, its store (the queue, the
      # lease). Nothing secret.
      - data:/data
      # One folder per run, served under /shots/ (through edge). Sandboxes reach it through the
      # broker (#393): a volume of its own only as sandboxes from before #393 mount it.
      - screenshots:/data/shots
      # Your configuration, one folder you keep in git (server.example/ to start from), read
      # only: config.yaml, your settings, read at start (docs/setup.md#settings); grants/,
      # what you grant each repo (hosts, Dockerfile, host mounts, limits), one
      # file per repo and default.yaml, read at each run (docs/security.md). Both optional.
      - ${DECKHAND_SERVER_DIR:-./server}:/etc/deckhand:ro
      # Each mount root you grant, at the same path and read-only: the orchestrator resolves the
      # paths repos ask for (.., symlinks) in it before mounting them into a sandbox.
      # - /nfs/work:/nfs/work:ro

  # The runs' tokens and the services' own, signed with a key only this service holds; the live
  # runs and their files (inbox, CA, digest, screenshots), which sandboxes reach through the
  # egress proxy (docs/services.md). One copy here: an update is a wait of a few seconds for
  # the runs' calls to it, which the proxy waits through (docs/architecture.md#restarts).
  broker:
    build:
      context: .
      dockerfile: broker/Dockerfile
    image: ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-broker:${DECKHAND_VERSION:-latest}
    restart: unless-stopped
    # Its calls in flight finish first: the inboxes' long polls (25 s), uploads (DRAIN_SECONDS).
    stop_grace_period: 35s
    environment:
      # Who calls, by the network a call arrives on: each caller has one of its own to the
      # broker, whose subnet is fixed below (docs/security.md#service-tokens).
      SERVICE_NETWORKS: orchestrator=${BROKER_ORCHESTRATOR_SUBNET:-10.231.250.0/28},edge=${BROKER_EDGE_SUBNET:-10.231.250.208/28},proxy=${BROKER_PROXY_SUBNET:-10.231.250.16/28},runner=${BROKER_RUNNER_SUBNET:-10.231.250.32/28},models=${BROKER_MODELS_SUBNET:-10.231.250.64/28},github=${BROKER_GITHUB_SUBNET:-10.231.250.176/28}
      # Where it publishes its public key, which the policy service and the runner mount read-only.
      SERVICE_KEYS_DIR: /service-keys
    volumes:
      # Its signing key (run-token.key, made on first start): this volume alone, never the
      # store nor another service's.
      - broker-keys:/keys
      # The live runs, their files and their events (lib/store-file.mjs).
      - broker-store:/data
      # Its public key (<kid>.pem), for the policy service and the runner to check service tokens with: nothing
      # secret, and a volume apart from its signing key's.
      - service-keys:/service-keys
    networks:
      - broker-orchestrator
      - broker-edge
      - broker-proxy
      - broker-runner
      - broker-models
      - broker-github
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The only service with the host's Docker socket (#503): it starts, follows and removes the
  # sandboxes, builds repo images and keeps the runs' logs, for the orchestrator alone, on a
  # network nothing else is on and that has no way out. Two copies may run, one acting and the
  # other waiting for its lease (docs/architecture.md, The runner service).
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    image: ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-runner:${DECKHAND_VERSION:-latest}
    restart: unless-stopped
    # Stopping ends the output streams it serves (the orchestrator follows again from the next
    # runner), lets its other calls finish (an image's build), then releases its lease.
    # Sandboxes keep running.
    stop_grace_period: 5m
    # The orchestrator's, the models service's (the Antigravity login's refresh), its own to the
    # broker service (its tokens, the runs' inboxes and files), to the github service (the repos'
    # tarballs), and to the policy service (what the operator's policies grant a repository).
    networks: [runner, runner-models, broker-runner, github-runner, policy-runner]
    environment:
      # The settings the runner reads too, as the orchestrator does (config.yaml, below, has the
      # rest): what it names on Docker, where sandboxes run, their engines, networks and agents.
      # GRANTS_DIR: the orchestrator's grants folder, which the runner checks every spec and build
      # against again (runner/spec-check.mjs, runner/builds.mjs), with what its
      # policies grant, asked of the policy service (POLICY_SERVICE_URL, its default).
      GRANTS_DIR: ${GRANTS_DIR:-}
      NAME_PREFIX: ${NAME_PREFIX:-}
      RUNNER: ${RUNNER:-}
      SANDBOX_ENGINE: ${SANDBOX_ENGINE:-}
      SANDBOX_SUBNETS: ${SANDBOX_SUBNETS:-}
      SANDBOX_SUBNET_SIZE: ${SANDBOX_SUBNET_SIZE:-}
      INSTALL_NETWORK: ${INSTALL_NETWORK:-}
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
      CODEX_VERSION: ${CODEX_VERSION:-}
      AGY_VERSION: ${AGY_VERSION:-}
      AGY_SHA256: ${AGY_SHA256:-}
      CLAUDE_CODE_VOLUME: ${CLAUDE_CODE_VOLUME:-}
      CODEX_VOLUME: ${CODEX_VOLUME:-}
      AGY_VOLUME: ${AGY_VOLUME:-}
      KUBERNETES_NAMESPACE: ${KUBERNETES_NAMESPACE:-}
      KUBERNETES_PENDING_MINUTES: ${KUBERNETES_PENDING_MINUTES:-}
      KUBERNETES_STORAGE_CLASS: ${KUBERNETES_STORAGE_CLASS:-}
      KUBERNETES_SESSION_SIZE: ${KUBERNETES_SESSION_SIZE:-}
      KUBERNETES_REGISTRY: ${KUBERNETES_REGISTRY:-}
      KUBERNETES_REGISTRY_SECRET: ${KUBERNETES_REGISTRY_SECRET:-}
      KUBERNETES_BUILDKIT: ${KUBERNETES_BUILDKIT:-}
      KUBERNETES_REGISTRY_HOSTS: ${KUBERNETES_REGISTRY_HOSTS:-}
      KUBERNETES_CACHE_STORAGE_CLASS: ${KUBERNETES_CACHE_STORAGE_CLASS:-}
      KUBERNETES_CACHE_SIZE: ${KUBERNETES_CACHE_SIZE:-}
      KUBERNETES_AGENT_STORAGE_CLASS: ${KUBERNETES_AGENT_STORAGE_CLASS:-}
      KUBERNETES_AGENT_SIZE: ${KUBERNETES_AGENT_SIZE:-}
      # Wiring, environment only, matching the orchestrator's. BROKER_URL: the name sandboxes
      # call the orchestrator's gateways by, through the egress proxy.
      SANDBOX_IMAGE: *sandbox-image
      ENGINE_IMAGE: *engine-image
      ENGINE_PODMAN_IMAGE: *engine-podman-image
      BROKER_URL: http://listener:8081
      EGRESS_PROXY: http://egress:3128
      # The broker service: its service tokens, the runs' inboxes and files.
      BROKER_SERVICE_URL: http://broker:8081
      # The orchestrator's endpoint for it: its services port (a run's first tokens).
      ORCHESTRATOR_URL: http://orchestrator:8083
      # The github service: the repos' tarballs and blobs, for build contexts.
      GITHUB_SERVICE_URL: http://github:8080
      # Its callers: the orchestrator, on the network they share, and the models service.
      SERVICE_NETWORKS: orchestrator=${RUNNER_SUBNET:-10.231.250.48/28},models=${RUNNER_MODELS_SUBNET:-10.231.250.112/28}
      # The broker's public keys, which its callers' service tokens are checked with.
      SERVICE_KEYS_DIR: /service-keys
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # Its store: the runs' logs, their events, its lease.
      - runner-data:/data
      # The broker's public keys (nothing secret), as the policy service has them.
      - service-keys:/service-keys:ro
      # Each run's inbox (comments for a running sandbox), its proxy CA and digest, which the
      # sandbox fetches from the broker (#393): a volume of its own only as sandboxes from before
      # #393 mount it.
      - runs:/data/runs
      # Your configuration, read only, as the orchestrator reads it: config.yaml, and grants/,
      # which the runner checks each sandbox's host paths and engine against again.
      - ${DECKHAND_SERVER_DIR:-./server}:/etc/deckhand:ro
      # Each mount root you grant, as on the orchestrator: the runner resolves a sandbox's host
      # paths again (.., symlinks) before Docker mounts them, and refuses those it can't see.
      # - /nfs/work:/nfs/work:ro

  # The only service with the GitHub App's key (#502, docs/services.md): the runs' GitHub and git
  # gateways (the egress proxy sends their calls here), the orchestrator's and edge's own GitHub
  # calls, and the
  # runner's tarballs. Its way out is GitHub's; each caller reaches it over a network of its own.
  github:
    build:
      context: .
      dockerfile: github/Dockerfile
    image: ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-github:${DECKHAND_VERSION:-latest}
    restart: unless-stopped
    # Stopping lets the calls in flight finish (pushes, clones, an Actions log): the proxy and the
    # orchestrator wait for the next copy meanwhile (docs/architecture.md#restarts).
    stop_grace_period: 5m
    depends_on: [broker, policy]
    environment:
      # GitHub's addresses, the repositories let through, and the grants folder (workflows,
      # allow_projects), as the orchestrator has them.
      GITHUB_URL: ${GITHUB_URL:-}
      GITHUB_API: ${GITHUB_API:-}
      ALLOWED_REPOS: ${ALLOWED_REPOS:-}
      GRANTS_DIR: ${GRANTS_DIR:-}
      # Its keys and tokens, and the runs' writes' and pushes' decisions.
      BROKER_SERVICE_URL: http://broker:8081
      POLICY_SERVICE_URL: http://policy:8181
      # Who calls, by the network a call arrives on (docs/security.md#service-tokens).
      SERVICE_NETWORKS: orchestrator=${GITHUB_ORCHESTRATOR_SUBNET:-10.231.250.128/28},edge=${GITHUB_EDGE_SUBNET:-10.231.250.224/28},proxy=${GITHUB_PROXY_SUBNET:-10.231.250.144/28},runner=${GITHUB_RUNNER_SUBNET:-10.231.250.160/28}
    volumes:
      # The App's key (app.json, from /setup): this
      # volume alone, never the store nor another service's.
      - github-key:/app-key
      # Its store (the runs' state, the idempotency keys) and the granted repos' git mirrors.
      - github-data:/data
      # Your configuration, read only, as the orchestrator reads it: config.yaml and grants/.
      - ${DECKHAND_SERVER_DIR:-./server}:/etc/deckhand:ro
    # Pushes of repositories granted `workflows` are saved in /tmp while checked (up to
    # 2 GiB each, one per run): a size-limited tmpfs keeps them off the host disk
    # (docs/security.md#github-actions-on-deckhands-branches).
    # tmpfs:
    #   - /tmp:size=4g
    # Its way out on a network of its own: on `default` too, its name would resolve there for
    # the orchestrator and the proxy, whose calls would then arrive on no caller's network.
    networks:
      - github-out
      - github-orchestrator
      - github-edge
      - github-proxy
      - github-runner
      - broker-github
      - policy-github
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The only service with the operator's agent credentials (#504, docs/services.md): the
  # sandboxes' agents call their APIs through it, by the egress proxy, with their run's token in
  # place of the credential. The plans' logins it refreshes are kept sealed in its store, with a
  # key of its own. Its way out is the agents' APIs; its other networks are internal, each its
  # callers' (the proxy, the orchestrator) or its callees' (the broker, the runner).
  models:
    build:
      context: .
      dockerfile: models/Dockerfile
    image: ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-models:${DECKHAND_VERSION:-latest}
    restart: unless-stopped
    # Stopping lets the agents' calls in flight finish: one streams for up to 10 minutes
    # (DRAIN_SECONDS, 600). New ones wait for the next copy meanwhile, 5 minutes at most at the
    # proxy (docs/services.md, Upgrades without downtime).
    stop_grace_period: 630s
    depends_on: [broker]
    # Its way out to the agents' APIs is a network of its own, not `default`: its callers are on
    # `default` too, and Docker's DNS would answer `models` with its address there, where it can't
    # tell them apart (SERVICE_NETWORKS).
    networks: [models-out, models-proxy, models-orchestrator, broker-models, runner-models]
    environment:
      # Claude Code's credential: one of the three (ANTHROPIC_AUTH_TOKEN for a gateway such
      # as OpenRouter). Never in a file, and never in a sandbox, nor in the orchestrator: this
      # service adds it to the sandboxes' API calls.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      # Optional: where those calls go (an API gateway, say). Default: api.anthropic.com.
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # Codex's OpenAI API key (docs/setup.md#codex), kept out of sandboxes the same way.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Or a ChatGPT plan's login (docs/setup.md#with-a-chatgpt-plan), which this service alone
      # holds and refreshes: codex-auth.json in the credentials folder below, or this file.
      CODEX_AUTH_FILE: ${CODEX_AUTH_FILE:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # The Antigravity CLI's Gemini API key (docs/setup.md#antigravity-cli), kept out of
      # sandboxes the same way.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Or a Google AI plan's login (docs/setup.md#with-a-google-ai-plan), which this service
      # alone holds and refreshes: agy-auth.json in the credentials folder below, or this file.
      AGY_AUTH_FILE: ${AGY_AUTH_FILE:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      # OpenRouter's key and address, for claude@openrouter in FALLBACKS
      # (docs/setup.md#fallbacks), which it checks as the orchestrator does.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      FALLBACKS: ${FALLBACKS:-}
      SANDBOX_AGENT: ${SANDBOX_AGENT:-}
      BRAINSTORM_AGENT: ${BRAINSTORM_AGENT:-}
      RUNNER: ${RUNNER:-}
      # Wiring, environment only. Who calls, by the network a call arrives on: the egress proxy
      # (the agents' calls) and the orchestrator, each over a network of its
      # own, whose subnet is fixed below.
      SERVICE_NETWORKS: proxy=${MODELS_PROXY_SUBNET:-10.231.250.80/28},orchestrator=${MODELS_ORCHESTRATOR_SUBNET:-10.231.250.96/28}
      # The broker service: its service tokens, whether a run still goes; its public keys,
      # which its callers' service tokens are checked with.
      BROKER_SERVICE_URL: http://broker:8081
      SERVICE_KEYS_DIR: /service-keys
      # The runner, which runs the Antigravity login's refresh (`agy models`).
      RUNNER_URL: http://runner:8080
    volumes:
      # The key the plans' logins are sealed with in its store (models.key, made on first
      # start): this volume alone, never the store nor another service's.
      - models-keys:/keys
      # Its store: the plans' refreshed logins (sealed), the runs' API state, its stream.
      - models-store:/data/store
      # The plans' logins (codex-auth.json, agy-auth.json), one folder on the host, git-ignored,
      # read only: you put them there when you sign in (docs/setup.md#the-credentials-folder).
      # The refreshed ones go in the store.
      - ${DECKHAND_CREDENTIALS_DIR:-./credentials}:/data/credentials:ro
      # Your configuration, read only, as the orchestrator reads it: config.yaml's base URLs.
      - ${DECKHAND_SERVER_DIR:-./server}:/etc/deckhand:ro
      # The broker's public keys (nothing secret).
      - service-keys:/service-keys:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The policy service (docs/services.md): Deckhand's, the operator's and the repositories' Rego
  # policies, evaluated by long-lived `opa` servers for the orchestrator, and for the runner the
  # grants the operator's give a repository. No secret, no state, and no network but its
  # callers': internal ones, without a way out.
  policy:
    build:
      context: .
      dockerfile: policy-service/Dockerfile
    image: ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-policy:${DECKHAND_VERSION:-latest}
    restart: unless-stopped
    # Stopping lets the decisions in flight finish (2 s each at most): the orchestrator waits for the
    # next copy meanwhile, up to 30 s, rather than refuse them (docs/architecture.md#restarts).
    stop_grace_period: 30s
    # The orchestrator's network to it, the github service's (the runs' writes and pushes) and the
    # runner's (what the operator's policies grant a repository).
    networks: [policy, policy-github, policy-runner]
    environment:
      # The operator's policies: GRANTS_DIR/policy/*.rego, below. Empty: /etc/deckhand/grants.
      GRANTS_DIR: ${GRANTS_DIR:-}
      # The broker's public keys, which the broker service writes: the service tokens are
      # checked with them, offline.
      SERVICE_KEYS_DIR: /keys
    volumes:
      # Your configuration, as the orchestrator has it, read only: the grants folder's policy/ is
      # what it reads (docs/security.md#policies).
      - ${DECKHAND_SERVER_DIR:-./server}:/etc/deckhand:ro
      - service-keys:/keys:ro
    # Each policy set is staged in /tmp while its opa runs.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The sandboxes' egress proxy: asks the orchestrator, for each connection, whether that
  # sandbox may reach that host.
  egress:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    image: ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-egress:${DECKHAND_VERSION:-latest}
    restart: unless-stopped
    # Stopping gives the requests in flight 25 s to finish (DRAIN_SECONDS,
    # docs/architecture.md#restarts): new connections are refused until the next proxy starts.
    stop_grace_period: 30s
    environment:
      # The egress policy's own port, open while the broker's drains on a restart; the broker's,
      # where relayed requests go, and the sandboxes' calls to it (the orchestrator's BROKER_URL),
      # which the proxy forwards (docs/architecture.md#restarts).
      POLICY_URL: http://orchestrator:8082/egress
      RELAY_URL: http://orchestrator:8081/relay
      # As sandboxes call it.
      BROKER_URL: http://listener:8081
      # Where the sandboxes' calls about their own run go: their token's renewal, their inbox
      # and files (#505).
      BROKER_SERVICE_URL: http://broker:8081
      # Where their GitHub calls and pushes go, the network they came from vouched for (#502).
      GITHUB_SERVICE_URL: http://github:8080
      # Where their agents' API calls go (#504).
      MODELS_SERVICE_URL: http://models:8080
    # Its way out (the hosts granted to runs), and its networks to the orchestrator, the broker,
    # the github service and the models service.
    networks: [default, orchestrator-proxy, broker-proxy, github-proxy, models-proxy]
    depends_on: [broker, github, models]
    volumes:
      # Answers from the hosts the grants list in cached_hosts, kept for every run, and the
      # CA with which the proxy decrypts their HTTPS: its key never leaves this volume
      # (docs/security.md#the-egress-cache). EGRESS_CACHE_MAX in environment sizes it.
      - egress-cache:/cache
    # How the runner finds it, to join it to each run's network.
    labels:
      deckhand.role: egress
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Pulls or builds the base image sandboxes run from (repo images build FROM it, and a new
  # base rebuilds them on their next run), then exits: the orchestrator starts them itself.
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: *sandbox-image
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  # The container engines, pulled or built like the sandbox image, with the `engine` profile
  # only: the orchestrator starts them next to granted runs' sandboxes.
  engine:
    profiles: [engine]
    build:
      context: .
      dockerfile: engine/Dockerfile
    image: *engine-image
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  engine-podman:
    profiles: [engine]
    build:
      context: .
      dockerfile: engine/podman/Dockerfile
    image: *engine-podman-image
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

# One network per caller of the broker, of the models service and of the github service,
# internal (no way out), with a subnet the service tells its callers apart by (SERVICE_NETWORKS
# above): set the *_SUBNET variables in .env if these clash with a network of the host's.
networks:
  default:
  broker-orchestrator:
    internal: true
    ipam:
      config:
        - subnet: ${BROKER_ORCHESTRATOR_SUBNET:-10.231.250.0/28}
  # Edge's own to the broker (its service tokens): BROKER_EDGE_SUBNET in .env for another one.
  broker-edge:
    internal: true
    ipam:
      config:
        - subnet: ${BROKER_EDGE_SUBNET:-10.231.250.208/28}
  broker-proxy:
    internal: true
    ipam:
      config:
        - subnet: ${BROKER_PROXY_SUBNET:-10.231.250.16/28}
  broker-runner:
    internal: true
    ipam:
      config:
        - subnet: ${BROKER_RUNNER_SUBNET:-10.231.250.32/28}
  broker-models:
    internal: true
    ipam:
      config:
        - subnet: ${BROKER_MODELS_SUBNET:-10.231.250.64/28}
  # One network per caller of the models service, the same way (its SERVICE_NETWORKS):
  # MODELS_PROXY_SUBNET and MODELS_ORCHESTRATOR_SUBNET in .env for others.
  models-proxy:
    internal: true
    ipam:
      config:
        - subnet: ${MODELS_PROXY_SUBNET:-10.231.250.80/28}
  models-orchestrator:
    internal: true
    ipam:
      config:
        - subnet: ${MODELS_ORCHESTRATOR_SUBNET:-10.231.250.96/28}
  # The models service's to the runner (the Antigravity login's refresh): RUNNER_MODELS_SUBNET
  # in .env for another one.
  runner-models:
    internal: true
    ipam:
      config:
        - subnet: ${RUNNER_MODELS_SUBNET:-10.231.250.112/28}
  # The models service's way out (the agents' APIs), with nothing else on it.
  models-out:
  # The github service's way to GitHub, alone.
  github-out:
  # Edge's way in (its published port) and out (GitHub's sign-in), alone.
  edge-out:
  broker-github:
    internal: true
    ipam:
      config:
        - subnet: ${BROKER_GITHUB_SUBNET:-10.231.250.176/28}
  # One network per caller of the github service, the same way: GITHUB_ORCHESTRATOR_SUBNET,
  # GITHUB_EDGE_SUBNET, GITHUB_PROXY_SUBNET and GITHUB_RUNNER_SUBNET in .env for others.
  github-orchestrator:
    internal: true
    ipam:
      config:
        - subnet: ${GITHUB_ORCHESTRATOR_SUBNET:-10.231.250.128/28}
  github-edge:
    internal: true
    ipam:
      config:
        - subnet: ${GITHUB_EDGE_SUBNET:-10.231.250.224/28}
  github-proxy:
    internal: true
    ipam:
      config:
        - subnet: ${GITHUB_PROXY_SUBNET:-10.231.250.144/28}
  github-runner:
    internal: true
    ipam:
      config:
        - subnet: ${GITHUB_RUNNER_SUBNET:-10.231.250.160/28}
  # The orchestrator and the policy service alone, the github service and the policy service alone:
  # internal, so the policy service has no way out.
  policy:
    internal: true
  policy-github:
    internal: true
  # The runner and the policy service alone, the same.
  policy-runner:
    internal: true
  # Edge and the orchestrator: each calls the other (the dashboard's API one way, the deliveries'
  # stream the other), nothing else is on it, and it has no way out. Its subnet is fixed, as each
  # tells the other by it (SERVICE_NETWORKS): EDGE_ORCHESTRATOR_SUBNET in .env for another one.
  edge-orchestrator:
    internal: true
    ipam:
      config:
        - subnet: ${EDGE_ORCHESTRATOR_SUBNET:-10.231.250.192/28}
  # The egress proxy and the orchestrator: its policy's questions, its relays. Internal: the
  # orchestrator has no way out.
  orchestrator-proxy:
    internal: true
  # The orchestrator and the runner: one calls the other, nothing else is on it, and it has no way
  # out. Its subnet is fixed, as each tells its caller by it (SERVICE_NETWORKS): RUNNER_SUBNET in
  # .env for another one. Outside Docker's default pools (172.17-172.31/16, 192.168/16), which a
  # busy host has already handed out, like the broker's networks beside it.
  runner:
    internal: true
    ipam:
      config:
        - subnet: ${RUNNER_SUBNET:-10.231.250.48/28}

volumes:
  # The orchestrator's.
  data:
  # Edge's: the App's credentials but its key, the session key, its store.
  edge-data:
  runner-data:
  screenshots:
    name: ${SHOTS_VOLUME:-deckhand-screenshots}
  runs:
    name: ${RUNS_VOLUME:-deckhand-runs}
  egress-cache:
  broker-keys:
  broker-store:
  # The GitHub App's key, the github service's alone; its store and git mirrors.
  github-key:
  github-data:
  models-keys:
  models-store:
  # The broker's public keys: the broker service writes them, the policy service, the runner and
  # the models service read them.
  service-keys:
