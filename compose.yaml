# What an operator runs: the listener, the egress proxy, and the sandbox image runs start
# from. Each sandbox sits on an internal network of its own, which the listener creates and
# joins itself and the egress proxy to: the proxy is their only way out (see docs/security.md).
#
#   cp .env.example .env    # then set a Claude credential (and ALLOWED_USERS, or in config.yaml)
#   cp -r server.example server   # your settings and grants, mounted below: keep it in git
#   docker compose pull && docker compose up -d
#   docker compose logs listener   # prints the one-time /setup link
#
# The images are the release DECKHAND_VERSION (default: the latest), published for each tag,
# or `edge` (amd64 only), published for each push to main.
# Updating is the same two commands, at any time: running sandboxes go on, and the new
# listener picks them up. `docker compose up -d --build` builds them from this checkout
# instead. The listener's port is published as is: put your own reverse proxy (TLS, host
# name) in front of it. See docs/setup.md.

name: deckhand

# The base image sandboxes run from: the `sandbox` service below pulls or builds it, the
# listener starts runs from it.
x-sandbox-image: &sandbox-image ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-sandbox:${DECKHAND_VERSION:-latest}
# The container engines runs of repositories granted allow_docker get (SANDBOX_ENGINE): the
# `engine` profile pulls or builds them (COMPOSE_PROFILES=engine in .env), docs/setup.md.
x-engine-image: &engine-image ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-engine:${DECKHAND_VERSION:-latest}
x-engine-podman-image: &engine-podman-image ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-engine-podman:${DECKHAND_VERSION:-latest}

services:
  listener:
    build:
      context: .
      dockerfile: listener/Dockerfile
    image: ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-listener:${DECKHAND_VERSION:-latest}
    restart: unless-stopped
    # Stopping only saves the queue and the runs' state: sandboxes keep running.
    stop_grace_period: 30s
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Every setting but the secrets and the wiring below can be in config.yaml instead
      # (docs/setup.md#settings). A variable set here, non-empty, wins over the file's key:
      # these pass .env's value, or nothing, so that the file's keys and the listener's
      # defaults apply.
      # Required, here or in config.yaml: GitHub logins allowed to start runs
      # (comma-separated). Empty: no start.
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      # Optional: only these repos (owner/repo, comma-separated), among those where the App
      # is installed. Empty: all of them.
      ALLOWED_REPOS: ${ALLOWED_REPOS:-}
      # Claude Code's credential: one of the three (ANTHROPIC_AUTH_TOKEN for a gateway such
      # as OpenRouter). Never in the file, and never in a sandbox: the listener adds it to the
      # sandboxes' API calls.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      # Optional: where those calls go (an API gateway, say). Default: api.anthropic.com.
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # Optional, with a gateway: its names for opus, sonnet and haiku.
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${ANTHROPIC_DEFAULT_OPUS_MODEL:-}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      # Optional: Claude Code's own --fallback-model, when the run's model is overloaded.
      CLAUDE_FALLBACK_MODEL: ${CLAUDE_FALLBACK_MODEL:-}
      # Codex's OpenAI API key (docs/setup.md#codex), kept out of sandboxes the same way.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Or a ChatGPT plan's login (docs/setup.md#with-a-chatgpt-plan), which the listener alone
      # holds and refreshes: codex-auth.json in the credentials folder below, or this file.
      CODEX_AUTH_FILE: ${CODEX_AUTH_FILE:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # Optional: the models best, balanced and fast stand for with Codex.
      CODEX_BEST_MODEL: ${CODEX_BEST_MODEL:-}
      CODEX_BALANCED_MODEL: ${CODEX_BALANCED_MODEL:-}
      CODEX_FAST_MODEL: ${CODEX_FAST_MODEL:-}
      # The Antigravity CLI's Gemini API key (docs/setup.md#antigravity-cli), kept out of
      # sandboxes the same way.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Or a Google AI plan's login (docs/setup.md#with-a-google-ai-plan), which the listener
      # alone holds and refreshes: agy-auth.json in the credentials folder below, or this file.
      AGY_AUTH_FILE: ${AGY_AUTH_FILE:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      # Optional: the models best, balanced and fast stand for with the Antigravity CLI.
      AGY_BEST_MODEL: ${AGY_BEST_MODEL:-}
      AGY_BALANCED_MODEL: ${AGY_BALANCED_MODEL:-}
      AGY_FAST_MODEL: ${AGY_FAST_MODEL:-}
      # OpenRouter's key, for claude@openrouter in FALLBACKS (docs/setup.md#fallbacks), and
      # where a run goes when its provider fails (or fallbacks in config.yaml).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FALLBACKS: ${FALLBACKS:-}
      # Optional: OpenRouter's address, and its names for opus, sonnet and haiku.
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENROUTER_OPUS_MODEL: ${OPENROUTER_OPUS_MODEL:-}
      OPENROUTER_SONNET_MODEL: ${OPENROUTER_SONNET_MODEL:-}
      OPENROUTER_HAIKU_MODEL: ${OPENROUTER_HAIKU_MODEL:-}
      # The agent of work runs, and of light runs (empty: SANDBOX_AGENT): claude, codex or
      # antigravity.
      SANDBOX_AGENT: ${SANDBOX_AGENT:-}
      BRAINSTORM_AGENT: ${BRAINSTORM_AGENT:-}
      CODEX_VERSION: ${CODEX_VERSION:-}
      AGY_VERSION: ${AGY_VERSION:-}
      # Optional: /setup detects it from your browser's address and stores it.
      PUBLIC_URL: ${PUBLIC_URL:-}
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
      SANDBOX_MODEL: ${SANDBOX_MODEL:-}
      SANDBOX_EFFORT: ${SANDBOX_EFFORT:-}
      # Brainstorms, inbox entries and discussions. Empty: SANDBOX_MODEL, SANDBOX_EFFORT.
      BRAINSTORM_MODEL: ${BRAINSTORM_MODEL:-}
      BRAINSTORM_EFFORT: ${BRAINSTORM_EFFORT:-}
      MAX_PARALLEL: ${MAX_PARALLEL:-}
      # What every sandbox may reach and its limits: grants/default.yaml, below.
      # A container engine for repos granted allow_docker: sysbox, podman or auto. Empty: none.
      SANDBOX_ENGINE: ${SANDBOX_ENGINE:-}
      # A range for the runs' networks (10.200.0.0/16), in blocks of SANDBOX_SUBNET_SIZE
      # (28). Empty: Docker's default address pools.
      SANDBOX_SUBNETS: ${SANDBOX_SUBNETS:-}
      SANDBOX_SUBNET_SIZE: ${SANDBOX_SUBNET_SIZE:-}
      TRIGGER: ${TRIGGER:-}
      ONBOARDING: ${ONBOARDING:-}
      BRAINSTORM_IDLE_MINUTES: ${BRAINSTORM_IDLE_MINUTES:-}
      # No value: passed only when .env sets it, where empty means no label.
      NEEDS_INPUT_LABEL:
      # Shortest interval at which repos that opt in are checked for conflicts (0: off).
      CONFLICT_CHECK_MINUTES: ${CONFLICT_CHECK_MINUTES:-}
      # How often comments waiting for other issues ("/after #77") ask GitHub again.
      WAITS_CHECK_MINUTES: ${WAITS_CHECK_MINUTES:-}
      # Days a run's log, summary and screenshots are kept (0: forever).
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-}
      NAME_PREFIX: ${NAME_PREFIX:-}
      CLAUDE_CODE_VOLUME: ${CLAUDE_CODE_VOLUME:-}
      CODEX_VOLUME: ${CODEX_VOLUME:-}
      AGY_VOLUME: ${AGY_VOLUME:-}
      # Advanced (docs/setup.md#advanced-settings).
      GRANTS_DIR: ${GRANTS_DIR:-}
      INSTALL_NETWORK: ${INSTALL_NETWORK:-}
      DEBOUNCE_MS: ${DEBOUNCE_MS:-}
      BRAINSTORM_DEBOUNCE_MS: ${BRAINSTORM_DEBOUNCE_MS:-}
      GITHUB_URL: ${GITHUB_URL:-}
      GITHUB_API: ${GITHUB_API:-}
      # Wiring, environment only. Names of what the listener creates on the host's Docker,
      # matching the ones below.
      SANDBOX_IMAGE: *sandbox-image
      ENGINE_IMAGE: *engine-image
      ENGINE_PODMAN_IMAGE: *engine-podman-image
      SHOTS_VOLUME: ${SHOTS_VOLUME:-deckhand-screenshots}
      RUNS_VOLUME: ${RUNS_VOLUME:-deckhand-runs}
      # The host's path of the socket mounted below: preview hooks get it too.
      DOCKER_SOCKET: ${DOCKER_SOCKET:-/var/run/docker.sock}
      # How sandboxes reach the token broker: this service, joined to each run's network
      # under this name.
      BROKER_URL: http://listener:8081
      # Their only way out: the egress service below (its deckhand.role label), joined the same
      # way.
      EGRESS_PROXY: http://egress:3128
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # The App's credentials (app.json), run logs, queue and brainstorm state.
      - data:/data
      # Shared with the sandboxes, one folder per run, served under /shots/.
      - screenshots:/data/shots
      # Each run's inbox: comments for a running sandbox, which reads its own folder only.
      - runs:/data/runs
      # Your configuration, one folder you keep in git (server.example/ to start from), read
      # only: config.yaml, your settings, read at start (docs/setup.md#settings); grants/,
      # what you grant each repo (hosts, preview hook, Dockerfile, host mounts, limits), one
      # file per repo and default.yaml, read at each run (docs/security.md). Both optional.
      - ${DECKHAND_SERVER_DIR:-./server}:/etc/deckhand:ro
      # The plans' logins the listener refreshes and writes back (codex-auth.json,
      # agy-auth.json), one folder on the host, git-ignored, read-write: you put them there
      # when you sign in (docs/setup.md#the-credentials-folder).
      - ${DECKHAND_CREDENTIALS_DIR:-./credentials}:/data/credentials
      # Each mount root you grant, at the same path and read-only: the listener resolves the
      # paths repos ask for (.., symlinks) in it before mounting them into a sandbox.
      # - /nfs/work:/nfs/work:ro

  # The sandboxes' egress proxy: asks the listener, for each connection, whether that
  # sandbox may reach that host.
  egress:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    image: ${DECKHAND_REGISTRY:-ghcr.io/bryansmee}/deckhand-egress:${DECKHAND_VERSION:-latest}
    restart: unless-stopped
    environment:
      POLICY_URL: http://listener:8081/egress
    volumes:
      # Answers from the hosts the grants list in cached_hosts, kept for every run, and the
      # CA with which the proxy decrypts their HTTPS: its key never leaves this volume
      # (docs/security.md#the-egress-cache). EGRESS_CACHE_MAX in environment sizes it.
      - egress-cache:/cache
    # How the listener finds it, to join it to each run's network.
    labels:
      deckhand.role: egress
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Pulls or builds the base image sandboxes run from (repo images build FROM it, and a new
  # base rebuilds them on their next run), then exits: the listener starts them itself.
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: *sandbox-image
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  # The container engines, pulled or built like the sandbox image, with the `engine` profile
  # only: the listener starts them next to granted runs' sandboxes.
  engine:
    profiles: [engine]
    build:
      context: .
      dockerfile: engine/Dockerfile
    image: *engine-image
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  engine-podman:
    profiles: [engine]
    build:
      context: .
      dockerfile: engine/podman/Dockerfile
    image: *engine-podman-image
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

volumes:
  data:
  screenshots:
    name: ${SHOTS_VOLUME:-deckhand-screenshots}
  runs:
    name: ${RUNS_VOLUME:-deckhand-runs}
  egress-cache:
