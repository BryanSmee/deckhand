# What an operator runs: the listener, the egress proxy, and the sandbox image runs start
# from. Sandboxes sit on an internal network: the proxy is their only way out (see
# docs/security.md).
#
#   cp .env.example .env    # then set ALLOWED_USERS and a Claude credential
#   docker compose up -d --build
#   docker compose logs listener   # prints the one-time /setup link
#
# The listener's port is published as is: put your own reverse proxy (TLS, host name) in
# front of it. See docs/setup.md.

name: deckhand

services:
  listener:
    build:
      context: .
      dockerfile: listener/Dockerfile
    image: deckhand-listener
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Required: GitHub logins allowed to start runs (comma-separated). Empty: no start.
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      # Optional: only these repos (owner/repo, comma-separated), among those where the App
      # is installed. Empty: all of them.
      ALLOWED_REPOS: ${ALLOWED_REPOS:-}
      # Claude Code's credential, passed to each sandbox: one of the two.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional: /setup detects it from your browser's address and stores it.
      PUBLIC_URL: ${PUBLIC_URL:-}
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.300}
      SANDBOX_MODEL: ${SANDBOX_MODEL:-opus}
      SANDBOX_EFFORT: ${SANDBOX_EFFORT:-medium}
      MAX_PARALLEL: ${MAX_PARALLEL:-2}
      # Hosts every sandbox may reach besides Anthropic and GitHub (*.domain and * work).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # Each sandbox's limits; the grants file can set them per repo.
      SANDBOX_CPUS: ${SANDBOX_CPUS:-2}
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-4g}
      SANDBOX_PIDS: ${SANDBOX_PIDS:-2048}
      TRIGGER: ${TRIGGER:-Claude work on this}
      BRAINSTORM_TRIGGER: ${BRAINSTORM_TRIGGER:-Claude let's brainstorm this}
      BRAINSTORM_STOP: ${BRAINSTORM_STOP:-Claude stop}
      BRAINSTORM_IDLE_MINUTES: ${BRAINSTORM_IDLE_MINUTES:-10}
      NEEDS_INPUT_LABEL: ${NEEDS_INPUT_LABEL-needs-input}
      # Names of what the listener creates on the host's Docker, matching the ones below.
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-deckhand-sandbox}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-deckhand-sandboxes}
      SHOTS_VOLUME: ${SHOTS_VOLUME:-deckhand-screenshots}
      CLAUDE_CODE_VOLUME: ${CLAUDE_CODE_VOLUME:-deckhand-claude-code}
      NAME_PREFIX: ${NAME_PREFIX:-deckhand}
      # The host's path of the socket mounted below: preview hooks get it too.
      DOCKER_SOCKET: ${DOCKER_SOCKET:-/var/run/docker.sock}
      # How sandboxes reach the token broker: this service, on the sandboxes' network.
      BROKER_URL: http://listener:8081
      # Their only way out: the egress service below.
      EGRESS_PROXY: http://egress:3128
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # The App's credentials (app.json), run logs, queue and brainstorm state.
      - data:/data
      # Shared with the sandboxes, one folder per run, served under /shots/.
      - screenshots:/data/shots
      # Optional: what you grant each repo (hosts, host mounts, limits): docs/security.md.
      # - ./grants.yaml:/etc/deckhand/grants.yaml:ro
      # Each mount root you grant, at the same path and read-only: the listener resolves the
      # paths repos ask for (.., symlinks) in it before mounting them into a sandbox.
      # - /nfs/work:/nfs/work:ro
    networks: [default, sandboxes]

  # The sandboxes' egress proxy: asks the listener, for each connection, whether that
  # sandbox may reach that host.
  egress:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    image: deckhand-egress
    restart: unless-stopped
    environment:
      POLICY_URL: http://listener:8081/egress
    networks: [default, sandboxes]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Builds the base image sandboxes run from (repo images build FROM it), then exits: the
  # listener starts them itself.
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: ${SANDBOX_IMAGE:-deckhand-sandbox}
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

networks:
  # Sandboxes, the listener's broker and the egress proxy. Fixed name: the listener attaches
  # runs to it. Internal: no route out, the listener refuses to start runs otherwise.
  sandboxes:
    name: ${SANDBOX_NETWORK:-deckhand-sandboxes}
    internal: true

volumes:
  data:
  screenshots:
    name: ${SHOTS_VOLUME:-deckhand-screenshots}
