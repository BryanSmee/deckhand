# What one repository gets: rename to <owner>/<repo>.yaml (matched case-insensitively), one
# file per repository, so CODEOWNERS can give each team its own. Every key:
# docs/security.md#the-grants-folder.

# Reachable by its sandboxes, besides default.yaml's.
# hosts: ["*.example.com"]
# Its .deckhand.yaml may add hosts of its own (never "*").
# allow_repo_hosts: true
# Its .deckhand.yaml's `dockerfile` is built on the host's Docker.
# allow_dockerfile: true
# Its .deckhand.yaml's `preview` hook runs, with the Docker socket: root on the host.
# allow_preview: true
# Its own limits, over default.yaml's.
# limits: { cpus: 4, memory: 8g }
# Host roots it may mount from (read-only unless read_only: false); the listener must see
# each one at the same path (compose.yaml).
# mounts:
#   - /srv/datasets
