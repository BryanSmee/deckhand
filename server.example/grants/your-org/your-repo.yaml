# What one repository gets: rename to <owner>/<repo>.yaml (matched case-insensitively), one
# file per repository, so CODEOWNERS can give each team its own. Every key:
# docs/security/policies.md#the-grants-folder.

# Reachable by its sandboxes, besides default.yaml's: the registries and APIs it needs.
# hosts: ["*.example.com", registry.npmjs.org]
# Of those, the ones whose answers the egress proxy keeps, besides default.yaml's.
# cached_hosts: [registry.npmjs.org]
# Its Dockerfile, engine, research runs, workflow pushes and auto-merge:
# ../policy/grants.rego, the operator's policies.
# Organization projects (v2), <organization>/<number> as in their URL: its runs add their
# issues and pull requests there, and the listener moves its issues on them from its
# .deckhand.yaml's `projects:` (docs/repo-config/issues.md#projects). Needs the App's Organization
# projects permission. Never in default.yaml.
# allow_projects: [your-org/3]
# Its own limits, over default.yaml's.
# limits: { cpus: 4, memory: 8g }
# Host roots it may mount from (read-only unless read_only: false); the listener must see
# each one at the same path (compose.yaml).
# mounts:
#   - /srv/datasets
