# What every repository gets beyond a sandbox (docs/security.md#the-grants-folder). Read
# again at each run: an edit applies without a restart. Nothing set: nothing granted.

# Hosts every repository's sandboxes may reach, besides Anthropic and GitHub: the place for
# hosts every repository needs (docs/security.md#where-a-sandboxs-hosts-come-from). Quote
# patterns starting with "*".
# hosts: [pypi.org]

# Of the hosts they may reach, those whose answers the egress proxy keeps for every run,
# HTTPS too: public mirrors downloaded from again and again (docs/setup.md#download-cache).
# cached_hosts: [deb.debian.org, dl-cdn.alpinelinux.org]

# The yes-or-no grants, all false by default; a repository's own file overrides each one.
# allow_dockerfile: false

# Every sandbox's limits, instead of the built-in 2 CPUs, 4g of memory and 2048 processes;
# a repository's own file can set its own.
# limits: { cpus: 2, memory: 8g, pids: 2048 }
