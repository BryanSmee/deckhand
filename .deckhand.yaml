max_parallel: 4
# The open issues labelled auto-pickup start by themselves, in the operator's AUTO_PICKUP_SLOTS.
auto_pickup: true

inbox:
  ideas: 15
  bugs: 16

# Prettier (npx) and the dashboard's and docs site's packages, downloaded once.
caches:
  - /home/node/.npm

# The dashboard's and the docs site's build-time packages, for their tests and builds, and
# graphql-js's bundle, which the GitHub gateway's tests import (AGENTS.md).
setup: >-
  (cd dashboard && npm ci --no-audit --no-fund) &&
  (cd docs && npm ci --no-audit --no-fund) &&
  cd listener/vendor && npm ci --no-audit --no-fund && npm run build

# A container engine for building and starting edge/Dockerfile, orchestrator/Dockerfile and the
# other images.
docker:
  cache: true

conflicts:
  check_minutes: 5

modes:
  release:
    instructions: .deckhand/modes/release.md
    agent: claude
    model: opus

review:
  on: ready
  ci: wait
  model: opus
  fix: 5
  follow_ups_auto_pickup: true
