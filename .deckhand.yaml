max_parallel: 4
inbox:
  ideas: 15
  bugs: 16
  discussions: Ask Claude

# Prettier (npx) and the dashboard's packages, downloaded once.
caches:
  - /home/node/.npm

# The dashboard's build-time packages, for its tests and build, and graphql-js's bundle, which
# the listener's tests import (AGENTS.md).
setup: >-
  (cd dashboard && npm ci --no-audit --no-fund) &&
  cd listener/vendor && npm ci --no-audit --no-fund && npm run build

# A container engine for building and starting edge/Dockerfile, orchestrator/Dockerfile and the
# other images.
docker:
  cache: true

conflicts:
  check_minutes: 5

review:
  on: ready
  model: opus
  effort: high
  fix: 3
